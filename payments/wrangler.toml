# KB payments Worker. Deploy: see payments/README.md
name = "kb-payments"
main = "worker.js"
compatibility_date = "2026-10-01"

# Created with: npx wrangler kv namespace create LICENCES   (paste the id it prints)
[[kv_namespaces]]
binding = "LICENCES"
id = "PASTE_KV_NAMESPACE_ID"

[vars]
# Public values only. Secrets go in with `npx wrangler secret put` (RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET).
RAZORPAY_KEY_ID = "rzp_test_PASTE"        # rzp_test_… while testing, rzp_live_… after activation
PRICE_PAISE = "99900"                      # ₹999.00 (amount in paise). Keep site.config.json -> pro.razorpay.price in step
CURRENCY = "INR"
PRODUCT_NAME = "KB Pro"
GOOGLE_CLIENT_ID = "PASTE.apps.googleusercontent.com"   # same as site.config.json -> googleClientId
ALLOWED_ORIGINS = "https://www.codingsaint.com,https://codingsaint.com,http://localhost:8080"
