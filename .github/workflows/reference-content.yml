name: Reference content checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebuild authored content
        run: |
          node build/assemble.js
          node build/make-fundamentals.js
          node build/make-lesson-figures.js
          node build/make-special-figures.js
          node build/make-model-designs.js
          git diff --exit-code -- content
          git diff --exit-code -- public/lessons
          git diff --exit-code -- public/designs
      - name: Check reference integrity and prerequisite links
        run: node scripts/check-reference-content.js
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Run executable reference mechanisms
        run: |
          mkdir -p .qa-classes
          javac -d .qa-classes examples/reference-invariants/ReferenceInvariants.java
          java -cp .qa-classes ReferenceInvariants
      - name: Compile versioned Spring API examples
        run: mvn -B -f examples/spring-api-contract/pom.xml compile
      - name: Build public site and run its personal-data safety scan
        run: node build/make-site.js
