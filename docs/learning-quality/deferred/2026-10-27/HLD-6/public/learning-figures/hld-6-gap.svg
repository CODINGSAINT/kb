<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc"><title id="title">Fill a missing range before advancing the contiguous receipt</title><desc id="desc">The server retains messages1 2 3. Bilal's phone receives1, then3; it buffers3 and keeps delivered-through1 and read-through0. Sync after1 supplies2 and3. Receiving2 drains buffered3, duplicate3 is ignored, and delivered-through becomes3. An explicit read signal then changes read-through to3; the laptop remains independent. Permanent retention/join gaps need an explicit history-window reset.</desc><defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#173044}.h{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:16px}.bold{font-weight:700}.box{fill:#edf5fa;stroke:#46677d;stroke-width:1.5}.ok{fill:#e8f6ee;stroke:#286a45;stroke-width:1.5}.note{fill:#fff5df;stroke:#9a6d1b;stroke-width:1.5}</style></defs><rect width="1080" height="720" rx="14" fill="#fff"/>
<text x="36" y="45" class="h">The largest sequence seen is not the complete prefix received</text><text x="36" y="78" class="b">Server C42 log: 1, 2, 3 · phone and laptop have independent receive/read state.</text>
<text x="56" y="129" class="s bold">Event</text><text x="492" y="129" class="s bold">Phone delivered</text><text x="690" y="129" class="s bold">Phone read</text><text x="866" y="129" class="s bold">Buffered</text>
<rect x="36" y="148" width="1004" height="63" rx="8" class="box"/><text x="56" y="187" class="b">Receive 1</text><text x="492" y="187" class="b bold">1</text><text x="690" y="187" class="b">0</text><text x="866" y="187" class="b">none</text>
<rect x="36" y="228" width="1004" height="63" rx="8" class="note"/><text x="56" y="267" class="b">Receive 3 before 2</text><text x="492" y="267" class="b bold">still 1</text><text x="690" y="267" class="b">0</text><text x="866" y="267" class="b">3</text>
<rect x="36" y="308" width="1004" height="89" rx="8" class="box"/><text x="56" y="343" class="b bold">SYNC after 1 returns 2 and 3</text><text x="56" y="374" class="s">Receive 2 → drain buffered 3; repeated 3 is deduplicated by immutable identity.</text>
<rect x="36" y="414" width="1004" height="63" rx="8" class="ok"/><text x="56" y="453" class="b">Gap repaired</text><text x="492" y="453" class="b bold">3</text><text x="690" y="453" class="b">still 0</text><text x="866" y="453" class="b">none</text>
<rect x="36" y="494" width="1004" height="63" rx="8" class="ok"/><text x="56" y="533" class="b">Explicit user read signal</text><text x="492" y="533" class="b">3</text><text x="690" y="533" class="b bold">3</text><text x="866" y="533" class="b">none</text>
<rect x="36" y="599" width="1004" height="79" rx="9" class="note"/><text x="56" y="631" class="b bold">Expired/pre-join history is a different kind of gap</text><text x="56" y="659" class="s">Acknowledge an explicit available-window boundary; never pretend old unavailable messages were received/read.</text></svg>
