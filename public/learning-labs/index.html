<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inside the design · CodingSaint KB</title><link rel="icon" href="../icons/brand-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="lab.css"><script src="lab.js" defer></script></head>
<body><main>
  <nav><a id="back" href="../">← Back to KB</a><button id="theme" type="button" aria-label="Switch colour theme">Switch theme</button></nav>
  <p class="eyebrow">codingsaint; / inside the design</p><h1 id="title">Loading the walkthrough…</h1><p id="intro"></p>
  <div class="toolbar"><label for="scenario">Choose a case</label><select id="scenario"></select></div>
  <section class="stage" aria-label="Current design state"><div id="visual"></div><div id="step" role="status" aria-live="polite" aria-atomic="true"></div></section>
  <div class="controls"><button id="prev" type="button">← Previous</button><span id="progress"></span><button id="next" type="button">Next →</button><button id="reset" type="button">Start again</button></div>
  <p class="hint">Each step is a recorded execution of the example code. Move at your own pace. Nothing runs automatically.</p>
  <details><summary>Read the complete trace as text</summary><ol id="transcript"></ol></details>
  <p id="error" role="alert" hidden></p>
</main></body></html>
