<svg width="630pt" height="474pt"
 viewBox="0.00 0.00 630.00 474.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-16-classes-title lld-16-classes-desc"><title id="lld-16-classes-title">Tic-tac-toe classes</title><desc id="lld-16-classes-desc">Game owns a private Board, two Players, the index of the current player, the number of moves made and a GameStatus, and offers makeMove. Board holds an N by N grid of Symbol cells and can place a symbol and check the lines through a cell. Player has a name, a Symbol and a MoveStrategy interface, implemented by HumanMove and BotMove.</desc>
