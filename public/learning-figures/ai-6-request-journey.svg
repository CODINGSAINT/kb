<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" role="img" aria-labelledby="title description">
  <title id="title">One synchronous explanation request</title>
  <desc id="description">The MVC controller reads one question. ExplanationService rejects invalid input before creating a fresh ChatClient request with system and user messages. Consuming call().content() invokes the selected ChatModel. The service checks returned text and the controller maps success to an answer body. Invalid questions produce HTTP 400. Empty text or a model exception produces a fixed HTTP 502 failure body, without returning private backend diagnostics. The default model is a fixed offline fixture; the optional live profile uses an adapter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#35566e"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#193248}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:650}.small{font-size:18px}.box{fill:white;stroke:#456b85;stroke-width:2;rx:14}.line{fill:none;stroke:#35566e;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="920" height="660" rx="18" fill="#f3f7fa"/>
  <text class="title" x="30" y="45">A request uses the objects startup created</text>
  <rect class="box" x="30" y="110" width="235" height="125"/>
  <text class="label" x="50" y="148">1. MVC controller</text>
  <text class="small" x="50" y="181">read question JSON</text>
  <text class="small" x="50" y="211">call the service</text>
  <path class="line" d="M265 172H332"/>
  <rect class="box" x="340" y="110" width="235" height="125"/>
  <text class="label" x="360" y="148">2. Input guard</text>
  <text class="small" x="360" y="181">nonblank; string limit</text>
  <text class="small" x="360" y="211">before model work</text>
  <path class="line" d="M575 172H642"/>
  <rect class="box" x="650" y="110" width="240" height="125"/>
  <text class="label" x="670" y="148">3. Fresh request</text>
  <text class="small" x="670" y="181">system + user messages</text>
  <text class="small" x="670" y="211">consume call().content()</text>
  <path class="line" d="M770 235V322"/>
  <text class="small" x="650" y="285">invoke model</text>
  <rect x="650" y="330" width="240" height="125" rx="14" fill="#e3eff8" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="670" y="368">4. ChatModel</text>
  <text class="small" x="670" y="401">fixed fixture by default</text>
  <text class="small" x="670" y="431">or selected live adapter</text>
  <path class="line" d="M650 392H583"/>
  <rect class="box" x="340" y="330" width="235" height="125"/>
  <text class="label" x="360" y="368">5. Output guard</text>
  <text class="small" x="360" y="401">reject absent/blank text</text>
  <text class="small" x="360" y="431">map backend exceptions</text>
  <path class="line" d="M340 392H273"/>
  <rect x="30" y="330" width="235" height="125" rx="14" fill="#e6f3ed" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="50" y="368">6. HTTP result</text>
  <text class="small" x="50" y="401">answer text on success</text>
  <text class="small" x="50" y="431">fixed public error on failure</text>
  <rect x="30" y="505" width="860" height="100" rx="14" fill="#fff0dd" stroke="#8b7146" stroke-width="2"/>
  <text class="small" x="50" y="539">Bad question → 400 before model work.</text>
  <text class="small" x="50" y="572">Empty answer / model call failure → 502. Never invent a fallback explanation.</text>
  <text class="small" x="30" y="639">A successful HTTP response does not establish that a model explanation is correct.</text>
</svg>
