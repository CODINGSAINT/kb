<svg width="766pt" height="543pt"
 viewBox="0.00 0.00 766.00 543.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-10-classes-title lld-10-classes-desc"><title id="lld-10-classes-title">Expense sharing classes</title><desc id="lld-10-classes-desc">An Expense has a payer, an amount in paise and a list of Splits, each naming a User and a share. SplitStrategy is an interface implemented by EqualSplit, ExactSplit and PercentSplit. ExpenseService uses a SplitStrategy to compute shares, records Expenses and updates the BalanceSheet of pairwise debts. DebtSimplifier reads net balances and suggests Payments.</desc>
