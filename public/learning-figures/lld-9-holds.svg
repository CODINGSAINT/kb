<svg width="1331pt" height="121pt"
 viewBox="0.00 0.00 1331.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-9-holds-title lld-9-holds-desc"><title id="lld-9-holds-title">Hold queue for one title</title><desc id="lld-9-holds-desc">Asha borrows the only copy C17. Bilal and then Chetan place holds and wait in order. When Asha returns C17 late, her fine is recorded and the copy goes on the hold shelf for Bilal for two days. Bilal does not collect it, so the daily job expires his hold and the copy is offered to Chetan, who collects it and starts a new loan.</desc>
