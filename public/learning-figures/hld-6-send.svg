<svg width="481pt" height="498pt"
 viewBox="0.00 0.00 481.00 498.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-6-send-title hld-6-send-desc"><title id="hld-6-send-title">Sending safely</title><desc id="hld-6-send-desc">The phone sends a message with a client message ID. The server checks whether that ID was already saved. If it is new, the server assigns the next chat sequence, saves the message and acknowledges. If it is a retry, the server returns the original sequence without saving a second copy.</desc>
