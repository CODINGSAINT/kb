<svg width="1242pt" height="261pt"
 viewBox="0.00 0.00 1242.00 261.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-4-flow-title lld-4-flow-desc"><title id="lld-4-flow-title">Seat booking flow</title><desc id="lld-4-flow-desc">The user selects seats. holdSeats checks every seat under the show lock; if any seat is taken the request fails and nothing changes. Otherwise all seats are held for 5 minutes and a pending booking is created. Payment runs outside the lock. If payment succeeds and the booking still holds its seats, the seats are booked and the booking is confirmed. If payment fails or the hold expired, the seats are released and any late payment is refunded.</desc>
