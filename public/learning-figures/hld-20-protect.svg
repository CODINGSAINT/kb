<svg width="749pt" height="201pt"
 viewBox="0.00 0.00 749.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-20-protect-title hld-20-protect-desc"><title id="hld-20-protect-title">Protecting backends</title><desc id="hld-20-protect-desc">Each upstream service has its own connection pool, so a slow service cannot use every connection. Requests carry a timeout. Failures feed a circuit breaker per upstream. When the payments service keeps failing, its breaker opens and requests fail fast instead of piling up, while the orders service, in its own pool, is unaffected.</desc>
