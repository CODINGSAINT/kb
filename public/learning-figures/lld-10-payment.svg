<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="title desc">
<title id="title">Reporting a payment is different from confirming its receipt</title><desc id="desc">Ben reports that he paid Asha 18 rupees and 34 paise. The report waits without changing balances. When authenticated Asha confirms receipt, one balanced journal entry credits Ben and debits Asha. A repeated confirmation returns the same result and creates no second entry. The application does not send money.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#246659"/></marker></defs>
<rect width="960" height="385" rx="18" fill="#f3f8f6"/>
<g font-family="Arial,sans-serif" fill="#142b2b">
<text x="34" y="40" font-size="23" font-weight="700">The app records agreement. It does not move the money.</text>
<g fill="#fff" stroke="#6c9489" stroke-width="1.5"><rect x="34" y="85" width="245" height="125" rx="13"/><rect x="355" y="85" width="245" height="125" rx="13"/><rect x="676" y="85" width="250" height="125" rx="13"/></g>
<g font-size="19" font-weight="700"><text x="54" y="118">1. Ben reports payment</text><text x="375" y="118">2. Wait for Asha</text><text x="696" y="118">3. Asha confirms</text></g>
<g font-size="17"><text x="54" y="150">P-1 · Ben → Asha</text><text x="54" y="180">INR 18.34</text><text x="375" y="150">State: PROPOSED</text><text x="375" y="180">Balances unchanged</text><text x="696" y="150">State: CONFIRMED</text><text x="696" y="180">One journal entry</text></g>
<g stroke="#246659" stroke-width="2.5" marker-end="url(#arrow)"><path d="M282 148H345"/><path d="M603 148H666"/></g>
<rect x="355" y="249" width="571" height="98" rx="13" fill="#e0f0e9" stroke="#6c9489"/>
<text x="377" y="280" font-size="18" font-weight="700">The posted change always sums to zero</text>
<text x="377" y="311" font-size="18">Ben +1834 paise · Asha −1834 paise</text>
<text x="34" y="280" font-size="17">Repeat confirmation?</text><text x="34" y="310" font-size="17">Return P-1 as confirmed.</text><text x="34" y="337" font-size="17">Do not post again.</text>
</g></svg>
