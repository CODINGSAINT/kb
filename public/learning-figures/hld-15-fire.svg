<svg width="850pt" height="235pt"
 viewBox="0.00 0.00 850.00 235.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-15-fire-title hld-15-fire-desc"><title id="hld-15-fire-title">Firing the 2 a.m. report</title><desc id="hld-15-fire-desc">At 02:00 the dispatcher that owns the partition finds the daily sales report due. In one transaction it creates the run with ID sch_41f at 02:00 and advances the next fire time to tomorrow. It queues the run, and worker 1 calls the report service. Worker 1 crashes, its lease expires, and worker 2 retries with the same run ID, which the report service recognises.</desc>
