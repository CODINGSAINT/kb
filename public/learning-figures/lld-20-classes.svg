<svg width="474pt" height="533pt"
 viewBox="0.00 0.00 474.00 533.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-20-classes-title lld-20-classes-desc"><title id="lld-20-classes-title">Calendar classes</title><desc id="lld-20-classes-desc">CalendarService keeps Events by person and by room and offers schedule, conflictsFor and firstCommonFree. Each Event has an id, a title, an organiser, attendees, a Slot and an optional room. A Slot is two Instants with an overlaps check. A WeeklyRule has a day of week, a local start time, a length and a ZoneId, and produces Slots.</desc>
