<svg width="993pt" height="138pt"
 viewBox="0.00 0.00 993.00 138.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-19-route-title ai-19-route-desc"><title id="ai-19-route-title">Routing with a fallback</title><desc id="ai-19-route-desc">A support question enters the AI gateway, which checks the team&#39;s budget and gives the run 8 seconds and 20,000 tokens. Classification goes to a small, fast model, which says complex, so the answer goes to a large model. Its provider returns 503; the router retries once, then falls back to a second provider that has passed the evaluation set. The answer is validated and its cost recorded for the support team.</desc>
