<svg width="905pt" height="121pt"
 viewBox="0.00 0.00 905.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-16-team-title ai-16-team-desc"><title id="ai-16-team-title">A small agent team</title><desc id="ai-16-team-desc">The coordinator splits the brief into research, writing and review. Four researchers gather refund-policy evidence for us and three competitors in parallel into one evidence bundle. The writer drafts from the bundle. The reviewer flags one claim that has no source. The writer fixes it in a single revision, and the coordinator accepts the brief within the shared budget.</desc>
