<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" role="img" aria-labelledby="title desc">
  <title id="title">An unknown cash outcome does not authorize a full refund</title><desc id="desc">Before reconciliation W17 has an unknown device outcome, one cash command, a $100 bank ledger with $60 held, and three twenties reserved. Retrying returns W17 without another dispense. Final evidence says two twenties reached the customer and one is quarantined. Settle $40, close the hold, and retain the jammed note outside available inventory. The bank ledger is now $60 and the ATM needs service.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#355471"/></marker></defs><rect width="980" height="550" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="42" font-size="24" font-weight="700">Unknown does not mean nothing moved</text><text x="28" y="73" font-size="16">Reconcile W17. A fresh withdrawal or a blind full refund would discard the missing fact.</text>
  <g fill="#fff" stroke="#7088a2" stroke-width="2"><rect x="28" y="115" width="393" height="303" rx="12" fill="#fff0d4"/><rect x="555" y="115" width="397" height="303" rx="12" fill="#e5f4ec"/></g>
  <g font-size="20" font-weight="700"><text x="48" y="151">Cash reply is inconclusive</text><text x="575" y="151">Final evidence: partial delivery</text></g>
  <g font-size="17"><text x="48" y="194">Bank ledger: $100</text><text x="48" y="229">Funds held: $60</text><text x="48" y="264">Reserved notes: 3 × $20</text><text x="48" y="299">Delivered amount: UNKNOWN</text><text x="48" y="334">Physical commands sent: 1</text><text x="48" y="369">Retry W17 → return saved state</text><text x="48" y="399" font-weight="700">No refund. No second dispense.</text><text x="575" y="194">Customer received: 2 × $20 = $40</text><text x="575" y="229">Quarantined: 1 × $20</text><text x="575" y="264">Bank debits $40; closes $60 hold</text><text x="575" y="299">Bank ledger: $60; funds held: $0</text><text x="575" y="334">Available cassette: 1 × $50</text><text x="575" y="369">Physical commands sent: still 1</text><text x="575" y="399" font-weight="700">Cash service needs maintenance.</text></g>
  <path d="M421 260H549" fill="none" stroke="#355471" stroke-width="2" marker-end="url(#arrow)"/><g font-size="14" text-anchor="middle"><text x="487" y="210">query original</text><text x="487" y="232">device command</text><text x="487" y="293">not a new</text><text x="487" y="315">cash request</text></g><text x="28" y="465" font-size="17">Every planned note is now classified: delivered + reusable + quarantined = 3 twenties.</text><text x="28" y="500" font-size="16">Proven zero delivery permits settlement at zero. An unknown outcome permits neither that inference nor a resend.</text>
  </g>
</svg>
