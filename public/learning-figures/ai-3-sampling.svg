 viewBox="0.00 0.00 418.00 411.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-3-sampling-title ai-3-sampling-desc"><title id="ai-3-sampling-title">Temperature and top-p on one distribution</title><desc id="ai-3-sampling-desc">The model&#39;s top candidates are A 0.50, B 0.25, C 0.15 and D 0.10. Temperature 0.5 sharpens them to about A 0.72, B 0.18, C 0.07, D 0.03. Top-p 0.7 instead keeps the smallest set reaching 0.7 – A and B – and renormalises to A two thirds, B one third. Temperature 0 always picks A.</desc>
