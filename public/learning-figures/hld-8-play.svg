<svg width="1094pt" height="189pt"
 viewBox="0.00 0.00 1094.00 189.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-8-play-title hld-8-play-desc"><title id="hld-8-play-title">Pressing Play</title><desc id="hld-8-play-desc">The Netflix app asks the playback service to play a title. The service checks that the plan is active and that fewer than two screens are in use. Steering picks an Open Connect box inside the viewer&#39;s ISP that holds the title. The player gets a DRM licence, streams segments from the box, and sends heartbeats that save the position.</desc>
