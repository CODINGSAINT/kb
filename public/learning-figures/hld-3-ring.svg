<svg width="570pt" height="565pt"
 viewBox="0.00 0.00 570.00 565.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-3-ring-title hld-3-ring-desc"><title id="hld-3-ring-title">Adding a node to a consistent hash ring</title><desc id="hld-3-ring-desc">Nodes A, B, C and D sit around a hash ring, and each key belongs to the next node clockwise. Keys k1 and k2 hash between B and C, so before the change they belong to C; key k3 hashes between C and D and belongs to D. When node E is added between k2 and C, only k1 and k2 move to E. k3 and every other key stay where they were.</desc>
