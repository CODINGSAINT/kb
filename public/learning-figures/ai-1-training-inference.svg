<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title description">
  <title id="title">Training changes weights; inference uses a model snapshot</title>
  <desc id="description">In the upper training lane, example text with target next tokens goes to a training program. Loss and an optimizer update model weights. In the lower inference lane, a counted request and a chosen weight snapshot enter inference. Inference produces vocabulary scores; a decoder chooses and appends a token. The changed prefix repeats this inference loop. The current inference request does not itself update the model snapshot. Provider logging and separate later training are different policies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#38526a"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#182f43}
      .heading{font-size:29px;font-weight:700}.label{font-size:23px;font-weight:650}.small{font-size:19px}.box{stroke:#3e607a;stroke-width:2;rx:14;fill:#fff}.line{stroke:#38526a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="650" rx="18" fill="#f3f7fa"/>
  <text class="heading" x="35" y="45">Two different operations</text>
  <rect x="25" y="70" width="850" height="220" rx="15" fill="#e3eff8"/>
  <text class="label" x="45" y="105">TRAINING</text>
  <rect class="box" x="45" y="130" width="215" height="105"/>
  <text class="label" x="65" y="164">Example text</text>
  <text class="small" x="65" y="195">and target tokens</text>
  <path class="line" d="M260 182H327"/>
  <rect class="box" x="335" y="130" width="240" height="105"/>
  <text class="label" x="355" y="164">Training program</text>
  <text class="small" x="355" y="195">loss + optimizer</text>
  <path class="line" d="M575 182H642"/>
  <text class="small" x="588" y="162">update</text>
  <rect class="box" x="650" y="130" width="200" height="105" fill="#f5f1ff"/>
  <text class="label" x="670" y="164">Weights</text>
  <text class="small" x="670" y="195">model snapshot</text>
  <text class="small" x="45" y="266">Many examples change parameters to improve the training objective.</text>
  <rect x="25" y="318" width="850" height="305" rx="15" fill="#e6f3ed"/>
  <text class="label" x="45" y="354">INFERENCE</text>
  <rect class="box" x="45" y="392" width="215" height="120"/>
  <text class="label" x="65" y="426">Counted request</text>
  <text class="small" x="65" y="457">instructions, question,</text>
  <text class="small" x="65" y="484">permitted evidence</text>
  <path class="line" d="M260 450H327"/>
  <rect class="box" x="335" y="392" width="240" height="120"/>
  <text class="label" x="355" y="426">Inference</text>
  <text class="small" x="355" y="457">use chosen weights</text>
  <text class="small" x="355" y="484">compute next scores</text>
  <path class="line" d="M750 235V305H455V385"/>
  <text class="small" x="534" y="328">read snapshot</text>
  <path class="line" d="M575 450H642"/>
  <rect class="box" x="650" y="392" width="200" height="120"/>
  <text class="label" x="670" y="426">Decode</text>
  <text class="small" x="670" y="457">choose a token</text>
  <text class="small" x="670" y="484">append to prefix</text>
  <path class="line" d="M750 512V560H455V519"/>
  <text class="small" x="474" y="549">repeat with the changed prefix</text>
  <text class="small" x="45" y="600">Stop at an end token, configured limit or other request stop condition.</text>
</svg>
