 viewBox="0.00 0.00 758.00 444.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">A shared admission decision before the backend</title><desc id="figure-desc">A client reaches an authenticated gateway. The gateway uses a locally cached trusted policy and executes a small script on the Redis primary selected by subject and route. An allow decision forwards the request. Exhausted quota returns 429; unavailable authority follows the route failure policy and can return 503. Replicas support recovery but never serve quota decisions.</desc>
