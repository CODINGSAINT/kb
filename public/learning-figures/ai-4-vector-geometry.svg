<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Unit vectors make dot product equal cosine</title><desc id="desc">The query and reset vector point along coordinate one at (1,0). The error vector (1,1) normalizes to approximately (0.707107,0.707107), 45 degrees away. Their cosine is 1 divided by square root two. The dotted arc shows unit length. Axes are arbitrary toy coordinates, not semantic topic dimensions.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34566e"/></marker></defs><rect width="900" height="620" rx="18" fill="#f2f7fb"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#193248"><text x="30" y="45" font-size="28" font-weight="700">Toy geometry, not learned topic axes</text><path d="M110 440H430M130 465V145" fill="none" stroke="#678198" stroke-width="2" marker-end="url(#a)"/><text x="435" y="447" font-size="20">x₁</text><text x="110" y="134" font-size="20">x₂</text><path d="M370 440A240 240 0 0 0 130 200" fill="none" stroke="#90a7ba" stroke-width="2" stroke-dasharray="7 5"/><path d="M130 440H370" stroke="#075d9f" stroke-width="5" marker-end="url(#a)"/><path d="M130 440L299.706 270.294" stroke="#287856" stroke-width="5" marker-end="url(#a)"/><circle cx="370" cy="440" r="6" fill="#075d9f"/><circle cx="299.706" cy="270.294" r="6" fill="#287856"/><text x="250" y="485" font-size="20">query/reset (1,0)</text><text x="280" y="245" font-size="20">unit error vector</text><text x="110" y="490" font-size="18">(0,0)</text><g font-size="21"><text x="500" y="165">Original error vector: (1,1)</text><text x="500" y="210">Length: √2</text><text x="500" y="255">Normalized: (1/√2, 1/√2)</text><text x="500" y="315">Dot with (1,0): 1/√2</text><text x="500" y="360">Cosine ≈ 0.707107</text><text x="500" y="405">Squared L2 ≈ 0.585786</text><text x="500" y="450">L2 distance ≈ 0.765367</text></g><text x="30" y="550" font-size="19">Zero/nonfinite vectors and incompatible spaces are rejected, not assigned a score of zero.</text><text x="30" y="590" font-size="19">All coordinates are hand-assigned fixtures; no semantic encoder was evaluated.</text></g></svg>
