<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
  <title id="title">Create a link: ownership comes from the durable transaction</title>
  <desc id="desc">Validate the owner's request and fingerprint, then find a retained request result. The same fingerprint replays the original result and a different fingerprint returns 409. A new transaction inserts a unique mapping candidate and its owner-scoped request result before commit. Generated-code collisions retry; an alias conflict returns 409 after rechecking concurrent replay. If another request wins the same request key, roll back the candidate mapping and read the winner. A response lost after commit is recovered by the original request key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#38546b"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#173044} .heading{font-size:25px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.bold{font-weight:700}.node{fill:#edf5fa;stroke:#46677d;stroke-width:1.6}.path{fill:none;stroke:#38546b;stroke-width:2;marker-end:url(#arrow)}.note{fill:#fff5df;stroke:#9a6d1b;stroke-width:1.4}.ok{fill:#e8f6ee;stroke:#286a45;stroke-width:1.6}</style>
  </defs>
  <rect width="1080" height="790" rx="14" fill="#ffffff"/>
  <text x="36" y="45" class="heading">A lost response must not create a second link</text>
  <text x="36" y="76" class="body">The owner + request key identifies the operation; the code identifies the mapping.</text>
  <rect x="36" y="110" width="444" height="72" rx="10" class="node"/>
  <text x="56" y="138" class="body bold">1. Authenticate and validate</text>
  <text x="56" y="164" class="small">Fingerprint destination + alias + expiry</text>
  <path d="M258 182V215" class="path"/>
  <rect x="36" y="218" width="444" height="81" rx="10" class="node"/>
  <text x="56" y="246" class="body bold">2. Read retained owner / request-key result</text>
  <text x="56" y="274" class="small">Same payload? Replay. Changed payload? 409.</text>
  <path d="M480 258H574" class="path"/>
  <text x="490" y="241" class="small">found</text>
  <rect x="581" y="218" width="458" height="81" rx="10" class="ok"/>
  <text x="601" y="247" class="body bold">Original code; no new mapping</text>
  <text x="601" y="276" class="small">Replay does not reactivate an expired/revoked link.</text>
  <path d="M258 299V344" class="path"/>
  <text x="275" y="328" class="small">not retained</text>
  <rect x="36" y="349" width="1003" height="240" rx="12" fill="#f8fafb" stroke="#7d91a0" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="56" y="381" class="body bold">One durable transaction — acknowledge only after commit</text>
  <rect x="61" y="410" width="273" height="92" rx="9" class="node"/>
  <text x="79" y="440" class="body bold">3. Insert candidate code</text>
  <text x="79" y="468" class="small">Unique key: code</text>
  <text x="79" y="490" class="small">Never overwrite a destination.</text>
  <path d="M334 452H393" class="path"/>
  <rect x="400" y="410" width="299" height="92" rx="9" class="node"/>
  <text x="418" y="440" class="body bold">4. Insert request result</text>
  <text x="418" y="468" class="small">Unique key: owner + request key</text>
  <text x="418" y="490" class="small">Result points to this mapping.</text>
  <path d="M699 452H756" class="path"/>
  <rect x="763" y="410" width="251" height="92" rx="9" class="ok"/>
  <text x="781" y="441" class="body bold">5. Commit → 201</text>
  <text x="781" y="469" class="small">Cache is optional.</text>
  <text x="781" y="491" class="small">Both rows become durable.</text>
  <text x="61" y="539" class="small bold">Code conflict:</text><text x="175" y="539" class="small">random → retry; requested alias → recheck replay, otherwise 409.</text>
  <text x="61" y="565" class="small bold">Request-key conflict:</text><text x="241" y="565" class="small">roll back the new mapping; read the winning committed result.</text>
  <path d="M891 589V630H258V305" class="path" stroke-dasharray="6 5"/>
  <text x="471" y="622" class="small">response lost after commit → same-key retry</text>
  <rect x="36" y="671" width="1003" height="82" rx="10" class="note"/>
  <text x="56" y="702" class="body bold">Failure boundary</text>
  <text x="56" y="730" class="body">Before commit: roll back both rows. After commit: return/recover the stored result.</text>
</svg>
