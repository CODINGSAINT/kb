<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title description">
  <title id="title">Returned JSON passes separate parsing and domain gates</title>
  <desc id="description">First reject empty, oversized or known truncated output. Strict conversion then checks one record's keys and types. The application checks schema version and source ID before domain validation of quantity, exact amounts, merchant and evidence quote. Valid candidates are ready for human review; incomplete or inconsistent candidates need information. Human source comparison remains necessary and no payment or posting action is available. A syntax/format failure has a separate bounded retry path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#38576f"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#193248}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:650}.small{font-size:18px}.box{fill:white;stroke:#456b85;stroke-width:2;rx:14}.line{fill:none;stroke:#38576f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="940" height="650" rx="18" fill="#f3f7fa"/>
  <text class="title" x="30" y="45">A record is a candidate, not proof of truth</text>
  <rect class="box" x="30" y="110" width="250" height="130"/>
  <text class="label" x="50" y="149">1. Raw-output guard</text>
  <text class="small" x="50" y="183">nonempty; within cap</text>
  <text class="small" x="50" y="215">reject known truncation</text>
  <path class="line" d="M280 175H337"/>
  <rect class="box" x="345" y="110" width="250" height="130"/>
  <text class="label" x="365" y="149">2. Strict conversion</text>
  <text class="small" x="365" y="183">one JSON document</text>
  <text class="small" x="365" y="215">keys, types, enums</text>
  <path class="line" d="M595 175H652"/>
  <rect class="box" x="660" y="110" width="250" height="130"/>
  <text class="label" x="680" y="149">3. Version and ID</text>
  <text class="small" x="680" y="183">schemaVersion = 1</text>
  <text class="small" x="680" y="215">sourceId matches R17</text>
  <path class="line" d="M785 240V327"/>
  <rect class="box" x="660" y="335" width="250" height="150"/>
  <text class="label" x="680" y="374">4. Domain checks</text>
  <text class="small" x="680" y="406">3 × 199.50 = 598.50</text>
  <text class="small" x="680" y="437">supported values</text>
  <text class="small" x="680" y="466">merchant + quote occur</text>
  <path class="line" d="M660 410H603"/>
  <rect x="345" y="335" width="250" height="150" rx="14" fill="#e7f3ec" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="365" y="374">5. Review outcome</text>
  <text class="small" x="365" y="406">ready candidate, or</text>
  <text class="small" x="365" y="437">needs information</text>
  <text class="small" x="365" y="466">no invented defaults</text>
  <path class="line" d="M345 410H288"/>
  <rect x="30" y="335" width="250" height="150" rx="14" fill="#fff0dd" stroke="#8b7146" stroke-width="2"/>
  <text class="label" x="50" y="374">6. Human comparison</text>
  <text class="small" x="50" y="406">show draft + receipt</text>
  <text class="small" x="50" y="437">check extracted facts</text>
  <text class="small" x="50" y="466">no posting or payment</text>
  <text class="small" x="30" y="550">An internally consistent wrong price can pass the implemented checks.</text>
  <text class="small" x="30" y="584">READY_FOR_REVIEW therefore means reviewable candidate, never approved expense.</text>
  <text class="small" x="30" y="620">Format failures use the separate one-retry path; other failures stay visible.</text>
</svg>
