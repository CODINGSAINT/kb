<svg width="1000pt" height="202pt"
 viewBox="0.00 0.00 1000.00 202.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-7-race-title lld-7-race-desc"><title id="lld-7-race-title">Two trips try to claim the same driver</title><desc id="lld-7-race-desc">Driver D1 is nearest to both Asha and Bilal and accepts both offers almost together. Asha&#39;s accept runs compareAndSet from AVAILABLE to ON_TRIP first and succeeds, so trip T1 is assigned to D1. Bilal&#39;s accept runs the same compareAndSet, finds D1 already ON_TRIP and fails, so Bilal&#39;s trip T2 stays REQUESTED and the offer moves to the next driver, D2.</desc>
