<svg width="1029pt" height="202pt"
 viewBox="0.00 0.00 1029.00 202.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-7-race-title lld-7-race-desc"><title id="lld-7-race-title">Two trips try to claim the same driver</title><desc id="lld-7-race-desc">Ravi is the nearest driver for both Asha and Bilal and accepts both offers almost together. Asha&#39;s accept runs compareAndSet from AVAILABLE to ON_TRIP first and succeeds, so Asha&#39;s trip is assigned to Ravi. Bilal&#39;s accept runs the same compareAndSet, finds Ravi already ON_TRIP and fails, so Bilal&#39;s trip stays REQUESTED and the offer moves to the next driver, Sunil.</desc>
