<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc">
  <title id="title">Capacity includes metadata, and eviction retires old fill permissions</title>
  <desc id="desc">A cache with at most two slots and six payload bytes first stores A with three bytes and B with three. Reading A makes B the least-recent slot. Loading C evicts B. Replacing A with four bytes evicts C to satisfy the six-byte payload limit. Evicting and recreating A produces slot 4 rather than its former slot 1, so the original slot-1 ticket is rejected. A slot's version and generation history can be forgotten safely only because old tickets also carry its retired incarnation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#38546b"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#173044}.heading{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.bold{font-weight:700}.node{fill:#edf5fa;stroke:#46677d;stroke-width:1.5}.empty{fill:#f7f9fb;stroke:#7d91a0;stroke-width:1.5;stroke-dasharray:5 4}.note{fill:#fff5df;stroke:#9a6d1b;stroke-width:1.5}.gone{fill:#fcecef;stroke:#9b3a4c;stroke-width:1.5}.line{fill:none;stroke:#38546b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="810" rx="14" fill="#ffffff"/>
  <text x="36" y="45" class="heading">A memory bound must include the state that rejects stale work</text>
  <text x="36" y="78" class="body">Teaching capacity: two slots + six encoded payload bytes. LRU is shown oldest → newest.</text>
  <text x="36" y="133" class="body bold">1. A and B fill the cache</text>
  <rect x="389" y="106" width="266" height="69" rx="8" class="node"/>
  <text x="409" y="136" class="body bold">A · slot 1 · 3 bytes</text><text x="409" y="161" class="small">oldest</text>
  <rect x="680" y="106" width="358" height="69" rx="8" class="node"/>
  <text x="700" y="136" class="body bold">B · slot 2 · 3 bytes</text><text x="700" y="161" class="small">2 slots / 6 bytes</text>
  <text x="36" y="237" class="body bold">2. Read A; then load C</text>
  <text x="36" y="267" class="small">B becomes oldest and is evicted.</text>
  <rect x="389" y="210" width="266" height="76" rx="8" class="node"/>
  <text x="409" y="243" class="body bold">A · slot 1 · 3 bytes</text><text x="409" y="270" class="small">still retained</text>
  <rect x="680" y="210" width="358" height="76" rx="8" class="node"/>
  <text x="700" y="243" class="body bold">C · slot 3 · 3 bytes</text><text x="700" y="270" class="small">2 slots / 6 bytes</text>
  <path d="M520 176V202" class="line"/>
  <text x="36" y="352" class="body bold">3. A grows to four bytes</text>
  <text x="36" y="382" class="small">C leaves to satisfy the byte bound.</text>
  <rect x="389" y="324" width="266" height="76" rx="8" class="node"/>
  <text x="409" y="357" class="body bold">A · slot 1 · 4 bytes</text><text x="409" y="384" class="small">1 slot / 4 bytes</text>
  <rect x="680" y="324" width="358" height="76" rx="8" class="empty"/>
  <text x="700" y="357" class="body">No second slot retained</text><text x="700" y="384" class="small">An oversize value would be rejected.</text>
  <path d="M520 287V316" class="line"/>
  <text x="36" y="467" class="body bold">4. Evict and recreate A</text>
  <text x="36" y="497" class="small">The same key gets a new identity.</text>
  <rect x="389" y="438" width="649" height="76" rx="8" class="node"/>
  <text x="409" y="471" class="body bold">A · slot 4 · no value yet</text>
  <text x="409" y="498" class="small">Generation may start at 0; slot identity has still changed.</text>
  <path d="M520 401V430" class="line"/>
  <rect x="36" y="551" width="1002" height="90" rx="10" class="gone"/>
  <text x="56" y="584" class="body bold">An old ticket still names slot 1 → reject RETIRED_SLOT</text>
  <text x="56" y="615" class="body">Forgetting the old generation counter cannot accidentally renew that reader's permission.</text>
  <rect x="36" y="677" width="1002" height="91" rx="10" class="note"/>
  <text x="56" y="710" class="body bold">Two bounds, two roles</text>
  <text x="56" y="741" class="body">Payload bytes bound data. Slot count also bounds keys and invalidation-only metadata.</text>
</svg>
