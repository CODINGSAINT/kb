<svg width="568pt" height="444pt"
 viewBox="0.00 0.00 568.00 444.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Delete the bucket only when forgetting it is safe</title><desc id="figure-desc">For capacity 1000 and refill one token per second, an empty bucket has zero tokens at time zero, 60 tokens after 60 seconds and 1000 tokens after 1000 seconds. Deleting at 60 seconds would recreate 1000 tokens instead of 60. The correct idle expiry waits until full, with an extra delay if the stored refill clock is ahead.</desc>
