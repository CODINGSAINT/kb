<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
<title id="title">Permissions live outside report wording</title><desc id="desc">Java authenticates and selects a permitted report before building the request. The report may contain an instruction to reveal credentials. Secrets are excluded and no action tools are exposed. The model's candidate still needs format and source-fact review. Delimiters communicate task/data boundaries but are not authorization.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34566e"/></marker></defs>
<rect width="900" height="510" rx="18" fill="#f2f7fb"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#193248"><text x="30" y="45" font-size="28" font-weight="700">An injected instruction does not grant permission</text>
<g fill="white" stroke="#456b85" stroke-width="2"><rect x="30" y="120" width="245" height="120" rx="12"/><rect x="330" y="120" width="245" height="120" rx="12"/><rect x="630" y="120" width="240" height="120" rx="12"/></g>
<g font-size="21" font-weight="650"><text x="50" y="160">Java source gate</text><text x="350" y="160">Report as user data</text><text x="650" y="160">Model candidate</text></g><g font-size="18"><text x="50" y="195">caller + permitted revision</text><text x="50" y="222">no unrelated reports</text><text x="350" y="195">may say “ignore the task”</text><text x="350" y="222">quoted instruction is data</text><text x="650" y="195">parse and validate</text><text x="650" y="222">review source support</text></g>
<path d="M275 180H322M575 180H622" fill="none" stroke="#34566e" stroke-width="3" marker-end="url(#a)"/>
<rect x="30" y="305" width="840" height="100" rx="12" fill="#fff0dd" stroke="#8b7146" stroke-width="2"/><text x="50" y="344" font-size="21" font-weight="650">Application controls</text><text x="50" y="378" font-size="19">Secrets excluded from context. No production-action tool. Safe text rendering.</text>
<text x="30" y="465" font-size="19">The model can still write a misleading summary; those controls do not prove factual accuracy.</text></g></svg>
