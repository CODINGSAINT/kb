<svg width="1005pt" height="201pt"
 viewBox="0.00 0.00 1005.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-4-fanout-title hld-4-fanout-desc"><title id="hld-4-fanout-title">One event fans out to push and email</title><desc id="hld-4-fanout-desc">The order service sends one order-shipped event. The notification service checks user preferences and enqueues a push message and an email message on separate queues. The push worker delivers through FCM and records SENT. The email worker&#39;s provider times out, so the email message is retried with backoff and is then sent.</desc>
