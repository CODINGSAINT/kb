<svg width="945pt" height="121pt"
 viewBox="0.00 0.00 945.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-17-gate-title ai-17-gate-desc"><title id="ai-17-gate-title">A release gate in action</title><desc id="ai-17-gate-desc">A candidate that switches to a cheaper model runs through the 200-case evaluation set. Correctness is close to the current version, 86 against 88 percent, but faithfulness drops from 95 to 89 percent. The gate rule says faithfulness may not drop more than 2 points, so the release is blocked. After a prompt fix, faithfulness recovers to 94 percent and the gate passes.</desc>
