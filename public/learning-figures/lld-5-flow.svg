<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 535" role="img" aria-labelledby="title desc">
  <title id="title">One stable withdrawal connects reservation, delivery and settlement</title><desc id="desc">First record the withdrawal and reserve exact notes. Then confirm a bank hold. Record cash-command intent and send one command. Final evidence must account for every note before settling the confirmed delivered amount and releasing the unused hold. Unknown bank authorization, cash delivery and settlement each have different query paths. None causes another cash command.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#355471"/></marker></defs><rect width="1020" height="535" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" fill="#17233b"><text x="26" y="42" font-size="24" font-weight="700">Keep one ID through every external effect</text><text x="26" y="72" font-size="16">Normal path: W17 reserves $60, delivers known cash, then settles that delivery.</text>
  <g fill="#fff" stroke="#7088a2" stroke-width="2"><rect x="26" y="121" width="218" height="150" rx="10"/><rect x="274" y="121" width="218" height="150" rx="10" fill="#e8f0ff"/><rect x="522" y="121" width="218" height="150" rx="10" fill="#fff0d4"/><rect x="770" y="121" width="224" height="150" rx="10" fill="#e5f4ec"/><rect x="274" y="351" width="218" height="115" rx="10"/><rect x="522" y="351" width="218" height="115" rx="10"/><rect x="770" y="351" width="224" height="115" rx="10"/></g>
  <g font-size="17" font-weight="700"><text x="42" y="155">1. Record + reserve</text><text x="290" y="155">2. Bank hold</text><text x="538" y="155">3. Cash command</text><text x="786" y="155">4. Bank settlement</text></g>
  <g font-size="15"><text x="42" y="192">Choose an exact plan.</text><text x="42" y="220">Reserve 3 × $20.</text><text x="42" y="248">Do not start cash yet.</text><text x="290" y="192">Confirmed? Continue.</text><text x="290" y="220">Declined? Release notes.</text><text x="290" y="248">Hold is not final debit.</text><text x="538" y="192">Record intent first.</text><text x="538" y="220">Send command W17 once.</text><text x="538" y="248">Account for every note.</text><text x="786" y="192">Debit delivered amount.</text><text x="786" y="220">Release the unused hold.</text><text x="786" y="248">Save confirmed result.</text></g>
  <g fill="none" stroke="#355471" stroke-width="2" marker-end="url(#arrow)"><path d="M244 195H268"/><path d="M492 195H516"/><path d="M740 195H764"/><path d="M383 271V345"/><path d="M631 271V345"/><path d="M882 271V345"/></g>
  <g font-size="15"><text x="290" y="381" font-weight="700">FUNDS_UNKNOWN</text><text x="290" y="411">Query original bank hold.</text><text x="290" y="441">No cash command yet.</text><text x="538" y="381" font-weight="700">CASH_UNKNOWN</text><text x="538" y="411">Query original device ID.</text><text x="538" y="441">Keep funds + notes held.</text><text x="786" y="381" font-weight="700">SETTLEMENT_UNKNOWN</text><text x="786" y="411">Retry same bank settlement.</text><text x="786" y="441">Never repeat physical cash.</text><text x="395" y="315">unknown</text><text x="643" y="315">unknown</text><text x="894" y="315">unknown</text></g><text x="26" y="505" font-size="16">Final delivery evidence, not a timeout or a screen message, determines what amount to settle.</text>
  </g>
</svg>
