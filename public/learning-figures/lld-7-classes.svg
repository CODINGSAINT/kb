<svg width="904pt" height="705pt"
 viewBox="0.00 0.00 904.00 705.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-7-classes-title lld-7-classes-desc"><title id="lld-7-classes-title">Cab booking classes</title><desc id="lld-7-classes-desc">RideService manages Trips and uses a MatchingStrategy to find candidate drivers, a FareStrategy to estimate and calculate fares, and a NotificationService to send offers and updates. A Trip links one Rider and, after acceptance, one Driver, with pickup and drop Locations, a TripStatus and a fare. A Driver has a Vehicle with a VehicleType, a current Location and a DriverStatus that is claimed atomically.</desc>
