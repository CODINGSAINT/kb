<svg width="711pt" height="719pt"
 viewBox="0.00 0.00 711.00 719.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-7-classes-title lld-7-classes-desc"><title id="lld-7-classes-title">Cab booking classes</title><desc id="lld-7-classes-desc">RideService holds the drivers and uses a MatchingStrategy, implemented by NearestDriverStrategy, and a FareStrategy, implemented by StandardFare. It creates Trips and moves them through their states. A Trip has a rider, pickup and drop Locations, a vehicle type, a TripStatus, an assigned Driver and a fare. A Driver has a vehicle type, a Location and an atomic DriverStatus claimed with tryClaim.</desc>
