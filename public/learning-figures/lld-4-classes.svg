<svg width="685pt" height="641pt"
 viewBox="0.00 0.00 685.00 641.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-4-classes-title lld-4-classes-desc"><title id="lld-4-classes-title">Movie booking classes</title><desc id="lld-4-classes-desc">A Screen has Seats. A Show plays one Movie on one Screen and owns one ShowSeat per Seat, with a price and a status of AVAILABLE, HELD or BOOKED. A Booking holds ShowSeats of one Show for a user. BookingService holds seats and confirms bookings, and charges through the PaymentService interface.</desc>
