<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title description">
  <title id="title">Boot startup selects one ChatModel and injects collaborators</title>
  <desc id="description">Properties and the active profile select either our explicit FixtureChatModel in the default configuration or an auto-configured OllamaChatModel in the ollama profile. The chosen ChatModel is a dependency of ChatClient.Builder auto-configuration. The prototype builder is injected into ExplanationService, which builds its client. The service is injected into the controller. This shows the relevant wiring, not every starter bean. Model pulling is disabled and no text-generation request happens merely because this application context is constructed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#35566e"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#193248}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:650}.small{font-size:18px}.box{fill:white;stroke:#456b85;stroke-width:2;rx:14}.line{fill:none;stroke:#35566e;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="920" height="680" rx="18" fill="#f3f7fa"/>
  <text class="title" x="30" y="45">Startup: select a model, then inject objects</text>
  <rect class="box" x="30" y="150" width="225" height="160"/>
  <text class="label" x="50" y="185">Configuration</text>
  <text class="small" x="50" y="218">BOM / starter classes</text>
  <text class="small" x="50" y="246">properties + profile</text>
  <text class="small" x="50" y="284">choose one branch</text>
  <path class="line" d="M255 200H285V160H322"/>
  <text class="small" x="270" y="125">default</text>
  <rect x="330" y="105" width="255" height="110" rx="14" fill="#e6f3ed" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="350" y="141">FixtureChatModel</text>
  <text class="small" x="350" y="173">our explicit bean</text>
  <text class="small" x="350" y="199">provider models disabled</text>
  <path class="line" d="M255 265H285V325H322"/>
  <text class="small" x="270" y="365">ollama profile</text>
  <rect x="330" y="270" width="255" height="110" rx="14" fill="#e3eff8" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="350" y="306">OllamaChatModel</text>
  <text class="small" x="350" y="338">conditional auto-config</text>
  <text class="small" x="350" y="364">explicit backend model name</text>
  <path class="line" d="M585 160H615V205H642"/>
  <path class="line" d="M585 325H615V260H642"/>
  <rect class="box" x="650" y="150" width="240" height="160"/>
  <text class="label" x="670" y="186">ChatClient.Builder</text>
  <text class="small" x="670" y="218">auto-configured</text>
  <text class="small" x="670" y="246">prototype scope</text>
  <text class="small" x="670" y="284">uses selected ChatModel</text>
  <path class="line" d="M770 310V425H457V472"/>
  <text class="small" x="555" y="414">constructor injection</text>
  <rect class="box" x="330" y="480" width="255" height="110"/>
  <text class="label" x="350" y="515">ExplanationService</text>
  <text class="small" x="350" y="547">build one client</text>
  <text class="small" x="350" y="574">fresh prompt per request</text>
  <path class="line" d="M585 535H642"/>
  <rect class="box" x="650" y="480" width="240" height="110"/>
  <text class="label" x="670" y="515">HTTP controller</text>
  <text class="small" x="670" y="547">receives the service</text>
  <text class="small" x="670" y="574">maps HTTP input/output</text>
  <text class="small" x="30" y="633">Relevant wiring only. The BOM itself adds no dependency and no model weights.</text>
  <text class="small" x="30" y="660">Here, automatic model pulling is disabled. Startup is not an inference test.</text>
</svg>
