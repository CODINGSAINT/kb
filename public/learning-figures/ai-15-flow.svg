<svg width="982pt" height="246pt"
 viewBox="0.00 0.00 982.00 246.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-15-flow-title ai-15-flow-desc"><title id="ai-15-flow-title">Discover, then call</title><desc id="ai-15-flow-desc">The support assistant&#39;s MCP client connects to the orders MCP server and initialises. It lists the server&#39;s tools and receives get_order and cancel_order with their schemas. The host offers them to the model. The model asks for get_order with order 5521; the client sends tools/call, the server queries the order service, and the status returns to the model.</desc>
