<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">Old events must name the owner they are allowed to change</title><desc id="desc">On October 18 C17 is assigned to B with pickup token P1 through October 20. On October 21 P1 expires and C receives P2 through October 23. C checks out using P2 and obtains loan L2, due November 11 under the Plus plan. An old P1 timer cannot release P2 or L2. A delayed return for A's closed loan L1 replays L1's receipt without closing L2.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="1000" height="550" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="41" font-size="24" font-weight="700">Same barcode, new ownership tokens</text><text x="28" y="73" font-size="16">C17 stays the physical item. A token identifies one assignment or one borrowing visit.</text>
  <g stroke="#7489a2" stroke-width="2" fill="#fff"><rect x="28" y="119" width="274" height="162" rx="10" fill="#fff0d4"/><rect x="363" y="119" width="274" height="162" rx="10" fill="#fff0d4"/><rect x="698" y="119" width="274" height="162" rx="10" fill="#e5f4ec"/><rect x="338" y="369" width="299" height="118" rx="10"/><rect x="674" y="369" width="298" height="118" rx="10"/></g>
  <g font-size="19" font-weight="700"><text x="47" y="155">C17 → B, pickup P1</text><text x="382" y="155">C17 → C, pickup P2</text><text x="717" y="155">C17 → C, loan L2</text></g>
  <g font-size="16"><text x="47" y="194">Assigned October 18.</text><text x="47" y="226">Valid through October 20.</text><text x="47" y="258">No active loan.</text><text x="382" y="194">Assigned October 21.</text><text x="382" y="226">Valid through October 23.</text><text x="382" y="258">P1 no longer owns it.</text><text x="717" y="194">C collected with P2.</text><text x="717" y="226">Due November 11.</text><text x="717" y="258">P2 is now consumed.</text><text x="356" y="403" font-weight="700">Old expiry event: P1</text><text x="356" y="437">Current token is P2, not P1.</text><text x="356" y="469">Return false; change nothing.</text><text x="692" y="403" font-weight="700">Old return event: L1</text><text x="692" y="437">L1 already has a receipt.</text><text x="692" y="469">Replay it; leave L2 active.</text></g>
  <g stroke="#385573" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M302 200H357"/><path d="M637 200H692"/></g><g font-size="13" text-anchor="middle"><text x="332" y="170">P1</text><text x="332" y="188">expires</text><text x="667" y="170">P2</text><text x="667" y="188">checkout</text></g>
  <g stroke="#9b4340" stroke-width="2" fill="none" stroke-dasharray="5 4"><path d="M487 369V294"/><path d="M823 369V294"/></g><g fill="#9b4340" font-size="27" text-anchor="middle"><text x="487" y="332">×</text><text x="823" y="332">×</text></g><text x="28" y="519" font-size="16">Check the current owner token before releasing inventory. Checking only the barcode is insufficient.</text>
  </g>
</svg>
