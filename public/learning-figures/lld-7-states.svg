<svg width="413pt" height="495pt"
 viewBox="0.00 0.00 413.00 495.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-7-states-title lld-7-states-desc"><title id="lld-7-states-title">Trip lifecycle</title><desc id="lld-7-states-desc">A trip starts REQUESTED. When a driver accepts it becomes DRIVER_ASSIGNED, then DRIVER_ARRIVED when the driver reaches the pickup, IN_PROGRESS when the rider is picked up, and COMPLETED at the drop, when the fare is calculated and the driver is released. The rider can cancel from REQUESTED, DRIVER_ASSIGNED or DRIVER_ARRIVED, which moves the trip to CANCELLED and releases any assigned driver.</desc>
