<svg width="701pt" height="201pt"
 viewBox="0.00 0.00 701.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-15-deadlock-title lld-15-deadlock-desc"><title id="lld-15-deadlock-title">Opposite transfers and lock order</title><desc id="lld-15-deadlock-desc">An Asha-to-Bilal transfer and a Bilal-to-Asha transfer start together. In the naive version, each locks its sender first, then waits for the other wallet, and they wait on each other forever. With a fixed lock order, both lock W-ASHA first; one transfer finishes and releases both locks, then the other runs.</desc>
