<svg width="769pt" height="330pt"
 viewBox="0.00 0.00 769.00 330.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-1-redirect-title hld-1-redirect-desc"><title id="hld-1-redirect-title">Short URL redirect path</title><desc id="hld-1-redirect-desc">The browser requests GET /aZ3k9Qx. The URL service checks Redis. On a cache hit it returns 302 with the long URL at once. On a miss it reads the URL database, stores the result in Redis and then returns 302. In both cases it sends a click event to Kafka without waiting for it.</desc>
