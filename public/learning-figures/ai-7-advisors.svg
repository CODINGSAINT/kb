<svg width="1009pt" height="240pt"
 viewBox="0.00 0.00 1009.00 240.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-7-advisors-title ai-7-advisors-desc"><title id="ai-7-advisors-title">A ChatClient request through advisors</title><desc id="ai-7-advisors-desc">The application calls ChatClient with a question and a conversation ID. The memory advisor adds the earlier messages of that conversation to the request, the logger advisor logs it, and the ChatModel calls the provider. On the way back the logger logs the response and the memory advisor stores the new question and answer, then the application reads the content.</desc>
