<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Two clicks from version zero produce one move</title><desc id="desc">Requests A and B both ask X to move from version zero. A obtains this Game's lock first, fills one cell, advances to version one and gives O the turn. B then gets the same lock, finds its expected version zero is stale and changes nothing. Either request may win the race. This is a one-process guarantee.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="920" height="470" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="40" font-size="24" font-weight="700">Same game, same version, one accepted move</text><text x="28" y="70" font-size="16">Either request can arrive first. The second must check the new state.</text>
  <g fill="#fff" stroke="#6e86a3" stroke-width="2"><rect x="28" y="113" width="270" height="100" rx="10"/><rect x="28" y="265" width="270" height="100" rx="10"/><rect x="370" y="105" width="310" height="274" rx="12" fill="#e9f1ff"/><rect x="740" y="164" width="145" height="145" rx="8"/></g>
  <g font-size="17"><text x="46" y="147" font-weight="700">Request A: X at (0,0)</text><text x="46" y="181">Expected version: 0</text><text x="46" y="299" font-weight="700">Request B: X at (0,1)</text><text x="46" y="333">Expected version: 0</text><text x="388" y="139" font-weight="700">One Game lock</text><text x="388" y="177">A: checks version 0, accepts.</text><text x="388" y="207">State → version 1; O to move.</text><text x="388" y="262">B: obtains the lock afterwards.</text><text x="388" y="292">Expected 0 ≠ current 1.</text><text x="388" y="322" font-weight="700">STALE_VERSION</text><text x="388" y="353">No second mark is placed.</text></g>
  <g stroke="#6e86a3" stroke-width="2"><path d="M788 164V309M837 164V309M740 212H885M740 261H885"/></g><text x="764" y="200" font-size="28" text-anchor="middle" font-weight="800">X</text><text x="811" y="341" text-anchor="middle" font-size="15">Version 1 · O next</text>
  <g fill="none" stroke="#385573" stroke-width="2" marker-end="url(#arrow)"><path d="M298 163H364"/><path d="M298 315H364"/><path d="M680 235H734"/></g><text x="28" y="428" font-size="16">Locking Board.place alone is insufficient: validation and turn change also belong inside it.</text>
  </g>
</svg>
