<svg width="796pt" height="121pt"
 viewBox="0.00 0.00 796.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-16-burst-title hld-16-burst-desc"><title id="hld-16-burst-title">Surviving a log burst</title><desc id="hld-16-burst-desc">An incident makes the order service log ten times more. The application keeps writing locally without waiting. Agents keep batching to the ingest gateway. Kafka absorbs the burst. Index workers fall behind for a few minutes, then catch up, and search becomes current again.</desc>
