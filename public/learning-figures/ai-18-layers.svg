 viewBox="0.00 0.00 1002.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-18-layers-title ai-18-layers-desc"><title id="ai-18-layers-title">An indirect injection, contained</title><desc id="ai-18-layers-desc">Asha asks for a summary of a vendor contract PDF that carries hidden instructions. The model is fooled and proposes emailing the finance salary sheet to an outside address. The data-access layer shows the salary sheet was never retrievable for Asha, the tool policy rejects the external domain, and the attempt is logged. No data leaves the company.</desc>
