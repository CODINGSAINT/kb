<svg width="888pt" height="121pt"
 viewBox="0.00 0.00 888.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-7-abr-title hld-7-abr-desc"><title id="hld-7-abr-title">Adaptive bitrate streaming</title><desc id="hld-7-abr-desc">The player downloads the manifest from the CDN, which lists segments for each resolution. It starts with 480p segments. When the measured speed rises it fetches the next segment in 1080p. When the train enters a tunnel and speed drops, it fetches the next segment in 240p, and playback continues without stopping.</desc>
