<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">Sampling, token limits and time limits control different things</title><desc id="desc">A capability check precedes the request. Temperature and top-p shape next-token choice. Input/context accounting and an output reservation limit tokens under the model's contract. A separate deadline and concurrency policy limits admission and waiting. The response's finish state and actual usage are inspected before task validation; an output cap can truncate JSON.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34566e"/></marker></defs><rect width="900" height="510" rx="18" fill="#f2f7fb"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#193248"><text x="30" y="45" font-size="28" font-weight="700">Different controls, different promises</text><g fill="white" stroke="#456b85" stroke-width="2"><rect x="30" y="110" width="250" height="145" rx="12"/><rect x="325" y="110" width="250" height="145" rx="12"/><rect x="620" y="110" width="250" height="145" rx="12"/></g><g font-size="22" font-weight="650"><text x="50" y="151">Sampling</text><text x="345" y="151">Token admission</text><text x="640" y="151">Time and load</text></g><g font-size="18"><text x="50" y="185">temperature / top-p</text><text x="50" y="217">choose a continuation</text><text x="50" y="241">do not establish truth</text><text x="345" y="185">counted input + output</text><text x="345" y="217">context/accounting rules</text><text x="345" y="241">not a time deadline</text><text x="640" y="185">overall deadline + queue</text><text x="640" y="217">bounded in-flight work</text><text x="640" y="241">not more provider quota</text></g><path d="M155 255V305H450V327M450 255V327M745 255V305H450" fill="none" stroke="#34566e" stroke-width="2.5" marker-end="url(#a)"/><rect x="135" y="335" width="630" height="100" rx="12" fill="#e6f3ed" stroke="#456b85" stroke-width="2"/><text x="155" y="372" font-size="22" font-weight="650">Inspect finish state and usage, then validate the task</text><text x="155" y="405" font-size="18">A truncated JSON prefix is not a successful incident card.</text><text x="30" y="480" font-size="19">All controls require the selected provider/model's supported contract.</text></g></svg>
