<svg width="776pt" height="204pt"
 viewBox="0.00 0.00 776.00 204.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-5-states-title lld-5-states-desc"><title id="lld-5-states-title">ATM state machine</title><desc id="lld-5-states-desc">Idle: inserting a card moves to HasCard. HasCard: a correct PIN moves to Authenticated; a wrong PIN stays in HasCard until the third failure, which ejects the card and returns to Idle; cancel also ejects to Idle. Authenticated: balance inquiry and withdrawal keep the machine in Authenticated; ejecting the card returns to Idle.</desc>
