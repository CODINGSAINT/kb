<svg width="496pt" height="250pt"
 viewBox="0.00 0.00 496.00 250.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-14-race-title lld-14-race-desc"><title id="lld-14-race-title">Race on the last token</title><desc id="lld-14-race-desc">Two threads ask for Asha&#39;s last token at the same moment. Without a lock both read one token and both are allowed, spending it twice. With the synchronized tryTake, thread A refills, takes the token and leaves zero; thread B then runs, sees zero tokens and is refused.</desc>
