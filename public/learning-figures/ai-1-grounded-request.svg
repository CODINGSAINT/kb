<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="title description">
  <title id="title">A grounded learning question passes through Java-owned gates</title>
  <desc id="description">An authenticated Java request gate defines the caller's course scope. A permitted-source query checks approval, access and revision. If needed evidence is absent, Java returns insufficient evidence. If it exists, Java budgets the request and a read-only model generates a draft. Java validates response format and citation IDs and rechecks access before display. The response includes supporting passages. Citation validity alone does not prove that every generated claim is supported; semantic quality needs separate evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#38526a"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#182f43}.heading{font-size:29px;font-weight:700}.label{font-size:23px;font-weight:650}.small{font-size:19px}.box{stroke:#3e607a;stroke-width:2;rx:14;fill:#fff}.line{stroke:#38526a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="850" rx="18" fill="#f3f7fa"/>
  <text class="heading" x="35" y="45">From question to a cited explanation</text>
  <rect class="box" x="45" y="80" width="810" height="90"/>
  <text class="label" x="65" y="115">1. Java request gate</text>
  <text class="small" x="65" y="145">Authenticate; derive course scope; enforce request and rate limits.</text>
  <path class="line" d="M265 170V217"/>
  <text class="small" x="280" y="202">caller scope</text>
  <rect class="box" x="45" y="225" width="810" height="100"/>
  <text class="label" x="65" y="260">2. Search approved, permitted sources</text>
  <text class="small" x="65" y="291">Return passage text + document, revision and passage IDs.</text>
  <path class="line" d="M265 325V372"/>
  <rect x="45" y="380" width="420" height="90" rx="14" fill="#e3eff8" stroke="#3e607a" stroke-width="2"/>
  <text class="label" x="65" y="415">Needed evidence present?</text>
  <text class="small" x="65" y="445">S1 and S2 support this question.</text>
  <path class="line" d="M465 425H572"/>
  <text class="small" x="500" y="408">no</text>
  <rect x="580" y="380" width="275" height="90" rx="14" fill="#fff0dd" stroke="#795f37" stroke-width="2"/>
  <text class="label" x="600" y="415">Missing evidence</text>
  <text class="small" x="600" y="445">Return explicit abstention.</text>
  <path class="line" d="M265 470V527"/>
  <text class="small" x="280" y="505">yes</text>
  <rect class="box" x="45" y="535" width="420" height="115"/>
  <text class="label" x="65" y="570">3. Count context; generate</text>
  <text class="small" x="65" y="601">Java admits the request. The model</text>
  <text class="small" x="65" y="628">writes a read-only explanation.</text>
  <path class="line" d="M465 592H522"/>
  <text class="small" x="477" y="575">draft</text>
  <rect class="box" x="530" y="535" width="325" height="115"/>
  <text class="label" x="550" y="570">4. Java output checks</text>
  <text class="small" x="550" y="601">Format, IDs, length, access.</text>
  <text class="small" x="550" y="628">Invalid output is rejected.</text>
  <path class="line" d="M692 650V697"/>
  <text class="small" x="708" y="678">accepted</text>
  <rect x="530" y="705" width="325" height="90" rx="14" fill="#e6f3ed" stroke="#3e607a" stroke-width="2"/>
  <text class="label" x="550" y="740">5. Answer + passages</text>
  <text class="small" x="550" y="770">Learner can inspect the sources.</text>
  <text class="small" x="45" y="735">A valid ID is not proof of support.</text>
  <text class="small" x="45" y="766">Evaluate the explanation separately.</text>
  <text class="small" x="45" y="824">The model cannot grant access, update grades or execute learner code.</text>
</svg>
