<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">A late return cannot create a second physical car</title><desc id="desc">At noon A still has CAR17 under R1 while B's R2 promises noon pickup. Handover to B is NOT_READY. A returns at 12:10; actual preparation ends at 13:10. R2 remains visibly at risk, cannot be treated as a customer no-show and may be cancelled free under the chosen policy. Old R1 return or expiry events cannot clear a later R2 owner.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="980" height="500" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="42" font-size="24" font-weight="700">The next promise survives the previous customer's lateness</text><g fill="#fff" stroke="#7489a2" stroke-width="2"><rect x="28" y="110" width="272" height="200" rx="10" fill="#fff0d4"/><rect x="354" y="110" width="272" height="200" rx="10"/><rect x="680" y="110" width="272" height="200" rx="10" fill="#e5f4ec"/></g><g font-size="19" font-weight="700"><text x="46" y="146">12:00: B arrives</text><text x="372" y="146">12:10: A returns</text><text x="698" y="146">B's chosen remedy</text></g><g font-size="16"><text x="46" y="188">Current owner: R1 (A).</text><text x="46" y="220">R2 cannot take CAR17.</text><text x="46" y="252">Decision: NOT_READY.</text><text x="46" y="284">Keep R2's promise visible.</text><text x="372" y="188">Record R1 return once.</text><text x="372" y="220">Actual ready-at: 13:10.</text><text x="372" y="252">R2's 12:00 promise conflicts.</text><text x="372" y="284">Do not rewrite it as fulfilled.</text><text x="698" y="188">No operator-ready vehicle.</text><text x="698" y="220">Not a customer no-show.</text><text x="698" y="252">Cancel R2 for Rs 0.</text><text x="698" y="284">Replacement is an extension.</text></g><g fill="none" stroke="#385573" stroke-width="2" marker-end="url(#a)"><path d="M300 210H348"/><path d="M626 210H674"/></g><text x="28" y="373" font-size="18" font-weight="700">History is not current ownership</text><text x="28" y="409" font-size="17">An R1 return replay returns R1's invoice. A stale R1 no-show requires CONFIRMED and cannot cancel R2.</text><text x="28" y="452" font-size="16">Readiness conflicts need a recorded remedy, not a second handover or an unjustified cancellation charge.</text></g></svg>
