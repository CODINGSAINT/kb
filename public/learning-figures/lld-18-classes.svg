<svg width="728pt" height="535pt"
 viewBox="0.00 0.00 728.00 535.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-18-classes-title lld-18-classes-desc"><title id="lld-18-classes-title">Train booking classes</title><desc id="lld-18-classes-desc">TrainRun has a Route, a list of Seats and a waitlist of Bookings. A Booking has a PNR, passengers, a Journey, its assigned seats and a BookingStatus. A Seat records, for each segment of the route, which booking holds it. A Journey is a range of segment indexes.</desc>
