<svg width="968pt" height="237pt"
 viewBox="0.00 0.00 968.00 237.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-5-read-title hld-5-read-desc"><title id="hld-5-read-title">News feed read path</title><desc id="hld-5-read-desc">When Ben opens his feed, the feed service reads the newest post IDs from his precomputed feed list in Redis and the recent post IDs of the celebrities he follows. It merges and sorts them by time-sortable ID, fetches post bodies and author details in one batch, filters out deleted or hidden posts, and returns twenty posts with a cursor for the next page.</desc>
