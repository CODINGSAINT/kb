<svg width="696pt" height="349pt"
 viewBox="0.00 0.00 696.00 349.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-13-retry-title lld-13-retry-desc"><title id="lld-13-retry-title">Retrying the right failures</title><desc id="lld-13-retry-desc">Asha&#39;s order-shipped notification is requested for email, SMS and push. Email times out, waits one second, times out again, waits four seconds and is sent on the third try. SMS is sent on the first try. Push is skipped because Asha turned it off. When the same event ID arrives again, nothing is sent.</desc>
