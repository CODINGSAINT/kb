<svg width="981pt" height="427pt"
 viewBox="0.00 0.00 981.00 427.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-5-classes-title lld-5-classes-desc"><title id="lld-5-classes-title">ATM classes</title><desc id="lld-5-classes-desc">ATM is the context. It holds one current ATMState, the inserted Card, a CashDispenser and a BankService. IdleState, HasCardState and AuthenticatedState implement the ATMState interface with insertCard, enterPin, checkBalance, withdraw and ejectCard. BankService authenticates, returns balances, debits and reverses. CashDispenser plans and dispenses notes.</desc>
