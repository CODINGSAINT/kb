<svg width="833pt" height="217pt"
 viewBox="0.00 0.00 833.00 217.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-2-bucket-title hld-2-bucket-desc"><title id="hld-2-bucket-title">Token bucket with capacity 5 and refill 2 per second</title><desc id="hld-2-bucket-desc">The bucket starts full with 5 tokens. Five requests at the same instant each spend one token and are allowed, leaving the bucket empty. A sixth request at that instant finds no token and is rejected with 429. Tokens refill at 2 per second, so half a second later one token is back and the next request is allowed.</desc>
