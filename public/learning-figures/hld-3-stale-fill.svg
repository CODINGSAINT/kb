<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
  <title id="title">Invalidation retires the old reader, not only the old value</title>
  <desc id="desc">At zero seconds reader A obtains a load ticket for slot 1 generation 0, then reads product version 41 at 499 rupees. At one second the product authority commits version 42 at 549 rupees and invalidation raises the minimum version to 42 and the generation to 1. At two seconds A's late fill is rejected because generation 0 is retired. A fresh ticket can fill version 42. Independently, all work from A's original ticket has a ten-second maximum age; late insertion cannot renew it if invalidation is delayed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#38546b"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#173044}.heading{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.bold{font-weight:700}.node{fill:#edf5fa;stroke:#46677d;stroke-width:1.5}.changed{fill:#e8f6ee;stroke:#286a45;stroke-width:1.5}.rejected{fill:#fcecef;stroke:#9b3a4c;stroke-width:1.5}.note{fill:#fff5df;stroke:#9a6d1b;stroke-width:1.5}.line{fill:none;stroke:#38546b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="790" rx="14" fill="#ffffff"/>
  <text x="36" y="45" class="heading">An old fill needs an identity that can be retired</text>
  <text x="36" y="78" class="body">One key: card:v1:tenant:23:product:784 · origin owns the product price/version.</text>
  <rect x="36" y="117" width="653" height="109" rx="10" class="node"/>
  <text x="56" y="151" class="body bold">t=0 · Read begins</text>
  <text x="56" y="181" class="body">Ticket = slot 1 / generation 0; source read returns v41, ₹499.</text>
  <text x="56" y="208" class="small">The old result is held in flight. No cache value has been installed.</text>
  <path d="M363 226V256" class="line"/>
  <rect x="36" y="263" width="653" height="110" rx="10" class="changed"/>
  <text x="56" y="297" class="body bold">t=1 · Commit v42, ₹549; deliver invalidation</text>
  <text x="56" y="327" class="body">minimumVersion = 42 · generation = 1 · remove older value</text>
  <text x="56" y="354" class="small">The database commit is durable independently of cache delivery.</text>
  <path d="M363 373V403" class="line"/>
  <rect x="36" y="410" width="653" height="110" rx="10" class="rejected"/>
  <text x="56" y="444" class="body bold">t=2 · Old reader tries FILL(v41)</text>
  <text x="56" y="474" class="body">Ticket generation 0 ≠ current generation 1 → reject</text>
  <text x="56" y="501" class="small">Deleting the old value alone would not identify this pending reader.</text>
  <path d="M363 520V550" class="line"/>
  <rect x="36" y="557" width="653" height="110" rx="10" class="changed"/>
  <text x="56" y="591" class="body bold">Fresh ticket + fresh source read</text>
  <text x="56" y="621" class="body">Generation 1 / v42 is accepted; cache now holds ₹549.</text>
  <text x="56" y="648" class="small">An older invalidation event cannot lower the retained version floor.</text>
  <rect x="724" y="117" width="318" height="550" rx="10" class="note"/>
  <text x="744" y="154" class="body bold">Separate hard age bound</text>
  <text x="744" y="195" class="small">A's ticket starts at t=0.</text>
  <text x="744" y="225" class="small">Its budget ends at t=10.</text>
  <text x="744" y="277" class="small">If invalidation is delayed,</text>
  <text x="744" y="305" class="small">a fill arriving at t=9 gets</text>
  <text x="744" y="333" class="small bold">only one second left.</text>
  <text x="744" y="386" class="small">At t=10, equality rejects it.</text>
  <text x="744" y="414" class="small">No stale-on-error renewal.</text>
  <text x="744" y="470" class="small">Only a new authoritative</text>
  <text x="744" y="498" class="small">read can justify a new</text>
  <text x="744" y="526" class="small">cache age budget.</text>
  <text x="744" y="584" class="small">Copying a value to another</text>
  <text x="744" y="612" class="small">cache must preserve the</text>
  <text x="744" y="640" class="small">remaining budget.</text>
  <text x="36" y="722" class="body bold">Generation protects observed changes. The age budget covers missing invalidations.</text>
  <text x="36" y="752" class="small">The local clock and node mechanism do not establish a distributed consistency or clock-health guarantee.</text>
</svg>
