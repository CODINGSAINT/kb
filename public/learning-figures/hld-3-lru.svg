<svg width="593pt" height="121pt"
 viewBox="0.00 0.00 593.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-3-lru-title hld-3-lru-desc"><title id="hld-3-lru-title">LRU eviction with room for three entries</title><desc id="hld-3-lru-desc">The cache holds at most three entries, ordered from most to least recently used. Put A, then B, then C gives C, B, A. Reading A moves it to the front: A, C, B. Putting D when full evicts the least recently used entry, B, giving D, A, C.</desc>
