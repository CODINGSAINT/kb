<svg width="1177pt" height="121pt"
 viewBox="0.00 0.00 1177.00 121.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-12-chain-title ai-12-chain-desc"><title id="ai-12-chain-title">An advisor chain</title><desc id="ai-12-chain-desc">A request passes through the PII mask advisor with order 0, the memory advisor with order 100, the retrieval advisor with order 200 and the logging advisor with order 1000, then reaches the model. The response travels back through the same advisors in reverse order; on the way out the memory advisor saves the turn.</desc>
