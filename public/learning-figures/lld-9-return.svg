<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">Return one borrowing visit, then allocate the physical copy</title><desc id="desc">The return includes barcode C17 and loan L1. If L1 is already closed, return its saved receipt without changing C17. Otherwise verify L1 is the current loan, close it and assess its fine once. A healthy copy is assigned directly to the first eligible edition hold; a damaged copy enters repair. Payment collection and actual message delivery are outside this circulation transition.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="1000" height="550" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="41" font-size="24" font-weight="700">A return closes a visit, not every use of a title</text><text x="28" y="73" font-size="16">The circulation lock covers loan closure, fine assessment, copy state and queue allocation.</text>
  <g stroke="#7489a2" stroke-width="2" fill="#fff"><rect x="28" y="115" width="280" height="132" rx="10"/><rect x="366" y="115" width="280" height="132" rx="10" fill="#e7f0ff"/><rect x="704" y="115" width="268" height="132" rx="10"/><rect x="28" y="358" width="280" height="112" rx="10"/><rect x="366" y="358" width="280" height="112" rx="10" fill="#e5f4ec"/><rect x="704" y="358" width="268" height="112" rx="10" fill="#fff0d4"/></g>
  <g font-size="18" font-weight="700"><text x="45" y="150">1. Match copy + loan</text><text x="383" y="150">2. Close and assess once</text><text x="721" y="150">3. Inspect condition</text><text x="45" y="390">Already returned?</text><text x="383" y="390">Healthy copy</text><text x="721" y="390">Damaged copy</text></g>
  <g font-size="16"><text x="45" y="188">C17 must still be using L1.</text><text x="45" y="220">Never close a new owner's loan.</text><text x="383" y="188">Due Oct 15; returned Oct 18.</text><text x="383" y="220">3 × 50 cents = $1.50.</text><text x="721" y="188">Closing L1 does not prove</text><text x="721" y="220">the item is lendable.</text><text x="45" y="426">Return the saved L1 receipt.</text><text x="45" y="453">Do not alter current ownership.</text><text x="383" y="426">Offer to B, the oldest eligible</text><text x="383" y="453">hold; save pickup P1 + notice.</text><text x="721" y="426">REPAIR; B remains waiting.</text><text x="721" y="453">Allocate after repair finishes.</text></g>
  <g stroke="#385573" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M308 181H360"/><path d="M646 181H698"/><path d="M168 247V352"/><path d="M838 247V352"/><path d="M760 247V303H506V352"/></g><g font-size="14"><text x="180" y="299">replay</text><text x="850" y="299">damaged</text><text x="570" y="293">good</text></g><text x="28" y="514" font-size="17">Assess the debt locally. Payment and real message delivery never delay returning the physical inventory.</text>
  </g>
</svg>
