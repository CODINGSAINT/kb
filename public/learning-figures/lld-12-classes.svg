<svg width="712pt" height="586pt"
 viewBox="0.00 0.00 712.00 586.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-12-classes-title lld-12-classes-desc"><title id="lld-12-classes-title">Cart and pricing classes</title><desc id="lld-12-classes-desc">A Cart holds Lines, each a Product and a quantity. PricingEngine holds an ordered list of PricingRules, implemented by BuyTwoGetOne and PercentCoupon, and produces a Quote containing Discounts, delivery, total and expiry. Checkout uses the engine to re-price and confirm a quote.</desc>
