<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 335" role="img" aria-labelledby="title desc">
<title id="title">Reversing an expense after payment creates a new obligation</title><desc id="desc">First Asha records a ninety-rupee dinner shared with Ben: she is owed forty-five and Ben owes forty-five. After Ben's confirmed forty-five-rupee payment both balances are zero. Reversing the mistaken dinner then makes Asha owe forty-five and Ben be owed forty-five. The payment remains in history; money was not automatically returned.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#246659"/></marker></defs><rect width="990" height="335" rx="18" fill="#f3f8f6"/>
<g font-family="Arial,sans-serif" fill="#142b2b"><text x="30" y="40" font-size="24" font-weight="700">A correction changes the ledger. It does not send cash back.</text>
<g fill="#fff" stroke="#6c9489" stroke-width="1.5"><rect x="30" y="80" width="265" height="154" rx="13"/><rect x="365" y="80" width="265" height="154" rx="13"/><rect x="700" y="80" width="260" height="154" rx="13"/></g>
<g font-size="19" font-weight="700"><text x="48" y="112">1. Dinner recorded</text><text x="383" y="112">2. Payment confirmed</text><text x="718" y="112">3. Dinner reversed</text></g>
<g font-size="18"><text x="48" y="149">Asha: +INR 45</text><text x="48" y="180">Ben: −INR 45</text><text x="48" y="212">Asha paid INR 90.</text><text x="383" y="149">Asha: INR 0</text><text x="383" y="180">Ben: INR 0</text><text x="383" y="212">Ben paid Asha INR 45.</text><text x="718" y="149">Asha: −INR 45</text><text x="718" y="180">Ben: +INR 45</text><text x="718" y="212">Payment still recorded.</text></g>
<g stroke="#246659" stroke-width="2.5" marker-end="url(#arrow)"><path d="M300 156H355"/><path d="M635 156H690"/></g>
<text x="30" y="278" font-size="19">Next suggestion: Asha → Ben INR 45.</text><text x="30" y="310" font-size="18">Only a separately reported and confirmed refund can settle that new obligation.</text></g></svg>
