<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc"><title id="title">Preparation belongs in the blocking interval</title><desc id="desc">A reserves CAR17 from 09:00 to 11:00. Preparation blocks 11:00 to 12:00. A proposed pickup at 11:00 overlaps and is rejected. A 12:00 pickup touches the half-open blocked end and can be reserved. Confirmation checks and inserts together, not from a stale search result.</desc><rect width="980" height="440" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="42" font-size="24" font-weight="700">The car is rented until 11:00; bookable again at 12:00</text><g font-size="16" text-anchor="middle"><text x="220" y="98">09:00</text><text x="364" y="98">10:00</text><text x="508" y="98">11:00</text><text x="652" y="98">12:00</text><text x="796" y="98">13:00</text><text x="940" y="98">14:00</text></g><g stroke="#b6c4d5"><path d="M220 110V328M364 110V328M508 110V328M652 110V328M796 110V328M940 110V328"/></g><g font-size="17"><text x="28" y="155">A: confirmed</text><text x="28" y="235">B: rejected</text><text x="28" y="315">B: allowed</text></g><rect x="220" y="124" width="288" height="48" fill="#3177ce" rx="5"/><rect x="508" y="124" width="144" height="48" fill="#ecc568" stroke="#17233b" stroke-dasharray="5 4"/><rect x="508" y="204" width="144" height="48" fill="#f5d7d3" stroke="#9b4340" rx="5"/><rect x="652" y="284" width="144" height="48" fill="#3177ce" rx="5"/><rect x="796" y="284" width="144" height="48" fill="#ecc568" stroke="#17233b" stroke-dasharray="5 4"/><g text-anchor="middle" font-size="15"><text x="364" y="154" fill="#fff">rental</text><text x="580" y="154">preparation</text><text x="580" y="234">overlap</text><text x="724" y="314" fill="#fff">rental</text><text x="868" y="314">preparation</text></g><text x="28" y="381" font-size="17">Overlap: A.start &lt; B.blockedEnd AND B.start &lt; A.blockedEnd.</text><text x="28" y="414" font-size="16">Search is a view. Confirmation rechecks and inserts the chosen vehicle's interval under one authority.</text></g></svg>
