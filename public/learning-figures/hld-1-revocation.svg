<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="770" viewBox="0 0 1080 770" role="img" aria-labelledby="title desc">
  <title id="title">Revocation versus a late cache fill: the original deadline survives</title>
  <desc id="desc">Timeline: at zero seconds an authoritative read takes active version 1 with serveUntil 30 seconds. At five seconds the owner commits revoked version 2 and invalidates the cache. At six seconds the old version 1 fill arrives and can still serve within the accepted bounded window; its deadline remains 30, not 36. At thirty seconds it is rejected, and a new authority read returns 410. With expiry at ten seconds, the earlier expiry truncates the permission to ten. Browser-cached or already issued redirects cannot be recalled by this service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#38546b"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#173044}.heading{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.bold{font-weight:700}.line{fill:none;stroke:#38546b;stroke-width:2;marker-end:url(#arrow)}.tick{fill:#ffffff;stroke:#38546b;stroke-width:2}.card{fill:#edf5fa;stroke:#46677d;stroke-width:1.5}.warn{fill:#fff5df;stroke:#9a6d1b;stroke-width:1.5}.gone{fill:#fcecef;stroke:#9b3a4c;stroke-width:1.5}</style>
  </defs>
  <rect width="1080" height="770" rx="14" fill="#ffffff"/>
  <text x="36" y="46" class="heading">Invalidation is helpful. The deadline is the bound.</text>
  <text x="36" y="78" class="body">Chosen policy: up to 30 seconds of server-cache staleness on the model's clock.</text>
  <path d="M80 137H1015" class="line"/>
  <circle cx="104" cy="137" r="8" class="tick"/><text x="84" y="118" class="body bold">t=0</text>
  <circle cx="369" cy="137" r="8" class="tick"/><text x="349" y="118" class="body bold">t=5</text>
  <circle cx="634" cy="137" r="8" class="tick"/><text x="614" y="118" class="body bold">t=6</text>
  <circle cx="917" cy="137" r="8" class="tick"/><text x="892" y="118" class="body bold">t=30</text>
  <text x="761" y="168" class="small">Sequence shown; spacing is not to scale.</text>
  <rect x="36" y="200" width="238" height="188" rx="10" class="card"/>
  <text x="54" y="232" class="body bold">Authority read starts</text>
  <text x="54" y="265" class="small">Active version 1</text>
  <text x="54" y="292" class="small">Permission: t &lt; 30</text>
  <text x="54" y="331" class="small">Capture deadline now,</text>
  <text x="54" y="356" class="small">not at the cache PUT.</text>
  <path d="M104 145V193" class="line"/>
  <rect x="291" y="200" width="238" height="188" rx="10" class="gone"/>
  <text x="309" y="232" class="body bold">Owner revokes</text>
  <text x="309" y="265" class="small">Commit version 2</text>
  <text x="309" y="292" class="small">Invalidate cached copy</text>
  <text x="309" y="331" class="small">The old read can still</text>
  <text x="309" y="356" class="small">be in flight.</text>
  <path d="M369 145V193" class="line"/>
  <rect x="546" y="200" width="238" height="188" rx="10" class="warn"/>
  <text x="564" y="232" class="body bold">Old fill arrives</text>
  <text x="564" y="265" class="small">Cache active version 1</text>
  <text x="564" y="292" class="small bold">Still ends at t=30</text>
  <text x="564" y="331" class="small">A 302 here is allowed</text>
  <text x="564" y="356" class="small">by the bounded policy.</text>
  <path d="M634 145V193" class="line"/>
  <rect x="801" y="200" width="238" height="188" rx="10" class="gone"/>
  <text x="819" y="232" class="body bold">Permission ends</text>
  <text x="819" y="265" class="small">Reject the old copy</text>
  <text x="819" y="292" class="small">Read authority → 410</text>
  <text x="819" y="331" class="small">No stale-on-error</text>
  <text x="819" y="356" class="small">extension is permitted.</text>
  <rect x="36" y="425" width="1003" height="106" rx="10" class="card"/>
  <text x="56" y="458" class="body bold">Expiry can shorten the same permission</text>
  <text x="56" y="489" class="body">If expiresAt = t=10, serveUntil = min(t=30, t=10) = t=10. At equality, reject.</text>
  <text x="56" y="516" class="small">Copying to Redis or a local hot-key cache must preserve this original deadline.</text>
  <rect x="36" y="565" width="1003" height="160" rx="10" class="warn"/>
  <text x="56" y="598" class="body bold">What this picture does and does not promise</text>
  <text x="56" y="630" class="body">Fresh leases require the current authority and a monitored clock-error budget.</text>
  <text x="56" y="661" class="body">The service chooses 302 + no-store; the browser's cache is a separate boundary.</text>
  <text x="56" y="692" class="body">An already issued redirect, retained destination or old browser copy cannot be recalled.</text>
</svg>
