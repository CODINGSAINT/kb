<svg width="501pt" height="597pt"
 viewBox="0.00 0.00 501.00 597.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-9-classes-title lld-9-classes-desc"><title id="lld-9-classes-title">Library management classes</title><desc id="lld-9-classes-desc">A Book is a catalogue title with ISBN, title and author, and owns a first-in-first-out queue of Holds. A BookItem is one physical copy with a barcode and an ItemStatus. A Member has a MembershipPlan with maximum books, loan days, renewals and fine per day. A Loan links one BookItem to one Member with a due date. LibraryService checks out, returns, renews, places holds and expires uncollected holds.</desc>
