<svg width="578pt" height="627pt"
 viewBox="0.00 0.00 578.00 627.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-9-classes-title lld-9-classes-desc"><title id="lld-9-classes-title">Library management classes</title><desc id="lld-9-classes-desc">A Book is a catalogue title with ISBN, title and authors; it has many BookItems, the physical copies with a barcode and ItemStatus, and a FIFO queue of Holds. A Member has a MembershipPlan with maximum books, loan days, renewals and fine per day, and has active Loans. A Loan links one BookItem to one Member with issue, due and return dates. Catalog indexes Books for search. LibraryService checks out, returns, renews and places holds.</desc>
