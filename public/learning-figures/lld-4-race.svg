<svg width="835pt" height="201pt"
 viewBox="0.00 0.00 835.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-4-race-title lld-4-race-desc"><title id="lld-4-race-title">Two customers race for the same seats</title><desc id="lld-4-race-desc">Asha and Bilal both ask to hold A7 and A8 for the same show at the same moment. The show lock lets Asha in first while Bilal waits. Asha&#39;s check finds both seats available, so both are held for her booking. Then Bilal gets the lock, his check finds A7 and A8 already held, and he is rejected with nothing changed.</desc>
