 viewBox="0.00 0.00 797.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-12-checkout-title hld-12-checkout-desc"><title id="hld-12-checkout-title">Checkout for one pair of shoes</title><desc id="hld-12-checkout-desc">Asha checks out. The order service creates a pending order and reserves the shoes in the Bengaluru warehouse for ten minutes. Payment of 3,499 rupees succeeds, so the reservation is confirmed as a sale and the order becomes confirmed. If payment had failed, the reservation would be released and the order cancelled.</desc>
