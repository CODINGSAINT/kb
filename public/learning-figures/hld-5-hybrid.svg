<svg width="785pt" height="237pt"
 viewBox="0.00 0.00 785.00 237.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-5-hybrid-title hld-5-hybrid-desc"><title id="hld-5-hybrid-title">Hybrid fanout: push for normal authors, pull for celebrities</title><desc id="hld-5-hybrid-desc">Asha has 200 followers. When she posts, fanout workers push her post ID into each follower&#39;s feed list, including Ben&#39;s. A celebrity with 50 million followers posts and nothing is pushed; the post stays in the celebrity&#39;s recent-posts list. When Ben opens his feed, the feed service reads his pushed list, pulls the celebrity&#39;s recent posts and merges them by time.</desc>
