<svg width="1237pt" height="299pt"
 viewBox="0.00 0.00 1237.00 299.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-8-pipeline-title ai-8-pipeline-desc"><title id="ai-8-pipeline-title">Structured output pipeline for a receipt</title><desc id="ai-8-pipeline-desc">The receipt text is sent with entity(ExpenseDraft.class), which adds a JSON schema to the prompt. The reply is parsed into an ExpenseDraft record. Java validation checks that 199.50 times 3 equals 598.50 and that the merchant and evidence quote appear in the receipt. A valid draft pre-fills the form. A parse error or truncated reply gets exactly one retry, and a value that fails validation is flagged for human review.</desc>
