<svg width="496pt" height="504pt"
 viewBox="0.00 0.00 496.00 504.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-15-classes-title lld-15-classes-desc"><title id="lld-15-classes-title">Wallet classes</title><desc id="lld-15-classes-desc">WalletService has Wallets and an append-only list of Transactions, plus a map from idempotency key to Transaction. A Wallet has an id, an owner, a balance and a maximum balance, with credit and debit. A Transaction records its TxType, from and to wallets, amount, idempotency key and time.</desc>
