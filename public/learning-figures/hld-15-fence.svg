<svg width="784pt" height="201pt"
 viewBox="0.00 0.00 784.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-15-fence-title hld-15-fence-desc"><title id="hld-15-fence-title">Dispatcher failover with fencing</title><desc id="hld-15-fence-desc">Dispatcher A owns partition 7 with lease token 41, then pauses for a long garbage collection and loses its lease. Dispatcher B takes partition 7 with token 42 and fires the due run. When A wakes and tries to fire with token 41, the write is rejected as stale, and the unique run ID would also block a second run.</desc>
