<svg width="1376pt" height="200pt"
 viewBox="0.00 0.00 1376.00 200.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-7-pipeline-title hld-7-pipeline-desc"><title id="hld-7-pipeline-title">Video processing pipeline</title><desc id="hld-7-pipeline-desc">The uploaded original is split into chunks at keyframes. Each chunk is transcoded into 240p, 480p, 720p and 1080p in parallel by separate workers. The outputs are packaged into short segments with a manifest, a thumbnail is created, outputs are verified, and only then is the video marked ready.</desc>
