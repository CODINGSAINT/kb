<svg width="1421pt" height="223pt"
 viewBox="0.00 0.00 1421.00 223.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-1-next-token-title ai-1-next-token-desc"><title id="ai-1-next-token-title">Generating text one token at a time</title><desc id="ai-1-next-token-desc">The prompt &#39;HashSet iteration order is&#39; is tokenized. The model scores every possible next token; &#39;not&#39; is most likely and is appended. The model then scores again with the longer text, picks &#39;guaranteed&#39; and appends it. The loop repeats until a stop token or the maximum output length.</desc>
