<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 505" role="img" aria-labelledby="title desc">
  <title id="title">Validate, place, decide, then return one snapshot</title><desc id="desc">While holding the Game lock, reject a finished game, invalid player, stale version, wrong turn, bad coordinate or occupied cell. Rejection returns the unchanged snapshot. Otherwise place one mark and increment the version. Check win before full-board draw; only an unfinished game switches turn.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="920" height="505" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="40" font-size="24" font-weight="700">A move is one complete transition</text><text x="28" y="69" font-size="16">The Game lock covers checks, placement, result, turn and snapshot.</text>
  <g stroke="#6e86a3" stroke-width="2" fill="#fff"><rect x="28" y="106" width="270" height="148" rx="10"/><rect x="360" y="106" width="220" height="148" rx="10" fill="#e9f1ff"/><rect x="644" y="106" width="246" height="148" rx="10" fill="#e5f5ef"/><rect x="28" y="341" width="270" height="108" rx="10"/><rect x="644" y="341" width="246" height="108" rx="10"/></g>
  <g font-size="18" font-weight="700"><text x="46" y="138">1. Validate</text><text x="378" y="138">2. Commit one mark</text><text x="662" y="138">3. Choose the result</text><text x="46" y="374">Rejected request</text><text x="662" y="374">4. Return snapshot</text></g>
  <g font-size="16"><text x="46" y="170">Game active? Player valid?</text><text x="46" y="198">Version and turn match?</text><text x="46" y="226">Cell in range and empty?</text><text x="378" y="179">Fill the chosen cell.</text><text x="378" y="211">Increase version by 1.</text><text x="662" y="170">Win? Finish with winner.</text><text x="662" y="198">Else full? Finish as draw.</text><text x="662" y="226">Else switch the player.</text><text x="46" y="408">No cell, turn, result or</text><text x="46" y="432">version changes.</text><text x="662" y="408">Decision + copied state.</text><text x="662" y="432">Finished = no next player.</text></g>
  <g stroke="#385573" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M298 179H354"/><path d="M580 179H638"/><path d="M767 254V335"/><path d="M163 254V335"/><path d="M298 395H638"/></g><g font-size="14"><text x="305" y="162">valid</text><text x="175" y="294">invalid</text><text x="368" y="385">return unchanged state</text></g>
  </g>
</svg>
