<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">O1's old timer cannot clear O2 or an accepted T2</title><desc id="desc">At t0 O1 reserves D1 for T1. At t15 it expires. After fresh telemetry, O2 reserves D1 for T2. Old O1 expiry and acceptance are inert because O1 is not the current pending token. Accepting O2 jointly assigns D1 and T2. An accepted assignment does not expire merely because its offer deadline later passes.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="1000" height="500" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="42" font-size="24" font-weight="700">Release the named offer, not whichever slot exists now</text><g fill="#fff" stroke="#7489a2" stroke-width="2"><rect x="28" y="113" width="274" height="169" rx="10" fill="#fff0d4"/><rect x="363" y="113" width="274" height="169" rx="10" fill="#fff0d4"/><rect x="698" y="113" width="274" height="169" rx="10" fill="#e5f4ec"/></g><g font-size="19" font-weight="700"><text x="47" y="151">D1 → O1 → T1</text><text x="382" y="151">D1 → O2 → T2</text><text x="717" y="151">D1 → T2, assigned</text></g><g font-size="16"><text x="47" y="194">Offer issued at t=0.</text><text x="47" y="228">Expires at t=15 seconds.</text><text x="47" y="262">No acceptance at equality.</text><text x="382" y="194">New token after O1 expiry.</text><text x="382" y="228">Old O1 no longer owns D1.</text><text x="382" y="262">Current owner must match.</text><text x="717" y="194">O2 accepts before deadline.</text><text x="717" y="228">Trip and driver agree.</text><text x="717" y="262">Offer timer cannot undo it.</text></g><g fill="none" stroke="#385573" stroke-width="2" marker-end="url(#a)"><path d="M302 202H357"/><path d="M637 202H692"/></g><path d="M500 356V294" stroke="#9b4340" stroke-width="2" stroke-dasharray="5 4"/><text x="500" y="328" fill="#9b4340" text-anchor="middle" font-size="28">×</text><text x="500" y="385" text-anchor="middle" font-size="18" font-weight="700">Delayed expiry/acceptance for O1: no change</text><text x="28" y="439" font-size="16">Acceptance and cancellation also compare the current trip state/version under this same authority.</text><text x="28" y="472" font-size="16">An old completion replays its fare before touching a driver now assigned to a different trip.</text></g></svg>
