<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Rank only the current eligible corpus</title><desc id="desc">Chunks arrive with tenant, document, revision and vector identity. Current policy checks the caller's tenant, permitted roles and current document revision before scoring and ranking. Staff-only, other-tenant or stale-revision chunks cannot enter the returned text or IDs. Results carry readable source identity. A production service rechecks authoritative access before use when policy can change during a request.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34566e"/></marker></defs><rect width="900" height="560" rx="18" fill="#f2f7fb"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#193248"><text x="30" y="45" font-size="28" font-weight="700">Similarity never grants access</text><g fill="white" stroke="#456b85" stroke-width="2"><rect x="30" y="130" width="245" height="180" rx="12"/><rect x="330" y="130" width="245" height="180" rx="12"/><rect x="630" y="130" width="240" height="180" rx="12"/></g><g font-size="22" font-weight="650"><text x="50" y="170">Versioned chunks</text><text x="350" y="170">Current policy gate</text><text x="650" y="170">Eligible ranking</text></g><g font-size="18"><text x="50" y="205">tenant + document ID</text><text x="50" y="239">source revision + text</text><text x="50" y="273">compatible space + vector</text><text x="350" y="205">caller tenant matches</text><text x="350" y="239">role may read source</text><text x="350" y="273">revision is current</text><text x="650" y="205">cosine / lexical / fusion</text><text x="650" y="239">source ID and text</text><text x="650" y="273">before caller or LLM sees it</text></g><path d="M275 220H322M575 220H622" fill="none" stroke="#34566e" stroke-width="3" marker-end="url(#a)"/><path d="M452 310V357" fill="none" stroke="#8b7146" stroke-width="3" marker-end="url(#a)"/><rect x="150" y="365" width="600" height="85" rx="12" fill="#fff0dd" stroke="#8b7146" stroke-width="2"/><text x="175" y="402" font-size="21" font-weight="650">Excluded: wrong tenant, denied role, retired revision</text><text x="175" y="433" font-size="18">Do not take a global top-k and leak forbidden evidence first.</text><text x="30" y="510" font-size="19">Immutable Java snapshots demonstrate the mechanism, not live distributed authorization.</text></g></svg>
