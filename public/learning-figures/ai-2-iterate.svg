<svg width="1328pt" height="138pt"
 viewBox="0.00 0.00 1328.00 138.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-2-iterate-title ai-2-iterate-desc"><title id="ai-2-iterate-title">Improving a prompt one step at a time</title><desc id="ai-2-iterate-desc">Version 1 asks only to summarise the incident and the model invents a database timeout as the cause. Version 2 adds a role and a JSON output format, so the shape is consistent, but the cause is still guessed. Version 3 adds the rule to use only the report and use null when a fact is not stated, plus one example with a missing cause, and the card correctly has cause null.</desc>
