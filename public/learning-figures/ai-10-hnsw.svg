<svg width="378pt" height="514pt"
 viewBox="0.00 0.00 378.00 514.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-10-hnsw-title ai-10-hnsw-desc"><title id="ai-10-hnsw-title">Searching an HNSW graph</title><desc id="ai-10-hnsw-desc">A query enters the top layer of an HNSW graph, which has few nodes and long links. It hops to the neighbour closest to the query, then drops to the middle layer with shorter links and continues, then drops to the bottom layer, which holds every chunk, and collects the five nearest after checking only a small part of the graph.</desc>
