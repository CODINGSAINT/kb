<svg width="527pt" height="703pt"
 viewBox="0.00 0.00 527.00 703.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-2-classes-title lld-2-classes-desc"><title id="lld-2-classes-title">Parking lot class diagram</title><desc id="lld-2-classes-desc">ParkingLot holds a list of ParkingSpots and a map of active Tickets, and uses a FeeStrategy, implemented by HourlyFeeStrategy. parkVehicle returns a Ticket and unparkVehicle returns the fee. A Ticket references one Vehicle, one ParkingSpot and the entry time. A ParkingSpot has a floor, number and size and can hold one Vehicle. Motorcycle, Car and Truck extend Vehicle.</desc>
