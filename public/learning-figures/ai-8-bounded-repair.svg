<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 690" role="img" aria-labelledby="title description">
  <title id="title">At most one format retry, using the original source</title>
  <desc id="description">The initial extraction goes through strict conversion. If it converts, it proceeds to domain checks. Only a format failure may request one new extraction from the original source and schema. A successful second conversion also proceeds to domain checks; a second format failure terminates as FAILED. Arithmetic conflicts and missing facts need information and are not rewritten automatically. Empty, oversized, known truncated, wrong-source or wrong-version output does not enter this format retry loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#38576f"/></marker>
    <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#193248}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:650}.small{font-size:18px}.box{fill:white;stroke:#456b85;stroke-width:2;rx:14}.line{fill:none;stroke:#38576f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="940" height="690" rx="18" fill="#f3f7fa"/>
  <text class="title" x="30" y="45">Repair format once; preserve factual conflicts</text>
  <rect class="box" x="40" y="105" width="300" height="105"/>
  <text class="label" x="60" y="142">Initial extraction</text>
  <text class="small" x="60" y="175">original receipt + schema</text>
  <path class="line" d="M340 157H492"/>
  <text class="small" x="374" y="140">call 1</text>
  <rect class="box" x="500" y="105" width="330" height="105"/>
  <text class="label" x="520" y="142">Strict conversion</text>
  <text class="small" x="520" y="175">keys, types, one document</text>
  <path class="line" d="M590 210V240H190V282"/>
  <text class="small" x="235" y="263">format failure only</text>
  <rect x="40" y="290" width="300" height="115" rx="14" fill="#e3eff8" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="60" y="327">One format retry</text>
  <text class="small" x="60" y="358">same source, same schema</text>
  <text class="small" x="60" y="388">no rejected payload echoed</text>
  <path class="line" d="M340 347H492"/>
  <text class="small" x="374" y="330">call 2</text>
  <rect class="box" x="500" y="290" width="330" height="115"/>
  <text class="label" x="520" y="327">Strict conversion again</text>
  <text class="small" x="520" y="358">success → domain checks</text>
  <text class="small" x="520" y="388">failure → terminal result</text>
  <path class="line" d="M830 157H880V530H838"/>
  <text class="small" x="848" y="440" transform="rotate(-90 848 440)">first conversion succeeded</text>
  <path class="line" d="M665 405V477"/>
  <text class="small" x="680" y="448">success</text>
  <rect x="500" y="485" width="330" height="100" rx="14" fill="#e7f3ec" stroke="#456b85" stroke-width="2"/>
  <text class="label" x="520" y="522">Domain / source checks</text>
  <text class="small" x="520" y="555">ready for review or needs info</text>
  <path class="line" d="M500 385H410V530H348"/>
  <text class="small" x="390" y="465" transform="rotate(-90 390 465)">second format failure</text>
  <rect x="40" y="485" width="300" height="100" rx="14" fill="#fff0dd" stroke="#8b7146" stroke-width="2"/>
  <text class="label" x="60" y="522">FAILED</text>
  <text class="small" x="60" y="555">stop after two invocations</text>
  <text class="small" x="30" y="630">Business conflicts keep their candidate values; there is no automatic price correction.</text>
  <text class="small" x="30" y="663">A live integration also needs aggregate token, time and spending limits.</text>
</svg>
