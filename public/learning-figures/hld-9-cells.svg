<svg width="838pt" height="201pt"
 viewBox="0.00 0.00 838.00 201.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-9-cells-title hld-9-cells-desc"><title id="hld-9-cells-title">Finding drivers with cells</title><desc id="hld-9-cells-desc">The city is divided into cells. A driver&#39;s location update puts the driver into exactly one cell set. A ride request looks in the rider&#39;s own cell and the ring of neighbouring cells, collects available drivers, filters out drivers not seen for 15 seconds, and ranks the rest by estimated road pickup time.</desc>
