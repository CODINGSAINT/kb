<svg width="826pt" height="274pt"
 viewBox="0.00 0.00 826.00 274.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-3-cache-aside-title hld-3-cache-aside-desc"><title id="hld-3-cache-aside-title">Cache-aside reads and writes</title><desc id="hld-3-cache-aside-desc">Read: the app asks the cache for the key. On a hit it returns the cached value. On a miss it reads the database, puts the value in the cache with a TTL and returns it. Write: the app updates the database first and then deletes the cache key, so the next read loads the fresh value.</desc>
