<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Reserve an offer, then accept both sides together</title><desc id="desc">Fresh matching selects available D1. Issuing O1 sets D1 OFFERED and T1 OFFERED with the same token. Acceptance requires a pending unexpired O1 current on both records, then sets D1 ON_TRIP for T1 and T1 ASSIGNED to D1 in one transition. A single-field driver update would leave the trip side unprotected.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#385573"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#17233b"><text x="28" y="42" font-size="24" font-weight="700">One accepted assignment needs two agreeing records</text><g fill="#fff" stroke="#7489a2" stroke-width="2"><rect x="28" y="111" width="280" height="216" rx="10"/><rect x="360" y="111" width="280" height="216" rx="10" fill="#fff0d4"/><rect x="692" y="111" width="280" height="216" rx="10" fill="#e5f4ec"/></g><g font-size="19" font-weight="700"><text x="46" y="148">1. Fresh candidate</text><text x="378" y="148">2. Exclusive offer O1</text><text x="710" y="148">3. Atomic acceptance</text></g><g font-size="16"><text x="46" y="188">D1: AVAILABLE.</text><text x="46" y="222">Position age &lt; 10 seconds.</text><text x="46" y="256">Within chosen 5 km radius.</text><text x="46" y="290">A map point is not a claim.</text><text x="378" y="188">D1: OFFERED, token O1.</text><text x="378" y="222">T1: OFFERED, token O1.</text><text x="378" y="256">One 15-second invitation.</text><text x="378" y="290">No other pending offer to D1.</text><text x="710" y="188">O1 pending, current, live?</text><text x="710" y="222">D1: ON_TRIP for T1.</text><text x="710" y="256">T1: ASSIGNED to D1.</text><text x="710" y="290">Commit both, or neither.</text></g><g stroke="#385573" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M308 219H354"/><path d="M640 219H686"/></g><text x="28" y="386" font-size="17">Cancellation, decline and expiry use the same authority and exact ownership identities.</text><text x="28" y="424" font-size="16">Notification and map lookups may run around this core; they cannot independently assign or release a driver.</text></g></svg>
