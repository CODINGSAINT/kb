<svg width="567pt" height="560pt"
 viewBox="0.00 0.00 567.00 560.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-6-classes-title lld-6-classes-desc"><title id="lld-6-classes-title">Car rental classes</title><desc id="lld-6-classes-desc">RentalService keeps the fleet of Vehicles and a calendar of Reservations per vehicle. It searches, reserves, picks up, returns and cancels. A Reservation links a customer to one Vehicle for a start and end time, has a ReservationStatus, and can check overlap with another time range including cleaning. PricingStrategy, implemented by DailyRatePricing, turns a Reservation into an Invoice.</desc>
