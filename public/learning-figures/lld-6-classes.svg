<svg width="635pt" height="546pt"
 viewBox="0.00 0.00 635.00 546.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-6-classes-title lld-6-classes-desc"><title id="lld-6-classes-title">Car rental classes</title><desc id="lld-6-classes-desc">A Branch has many Vehicles. Each Vehicle has a VehicleType and a current VehicleStatus. A Reservation links one Customer to one Vehicle for a start and end time with a ReservationStatus, can check overlap with another time range, and produces an Invoice on return. RentalService searches, reserves, picks up, returns and cancels, and uses a PricingStrategy to build the Invoice.</desc>
