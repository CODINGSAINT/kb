 viewBox="0.00 0.00 279.00 675.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">The prompt is prepared before the model is invoked</title><desc id="figure-desc">The application validates the question. ChatClient combines system and user messages into a new request. Its advisor chain reaches ChatModel. The offline fixture returns a ChatResponse without network access; a live ChatModel adapter would call its provider. The application consumes one response, reads text and metadata, and validates structured fields before returning them.</desc>
