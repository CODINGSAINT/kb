<svg width="1512pt" height="209pt"
 viewBox="0.00 0.00 1512.00 209.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-4-pipeline-title hld-4-pipeline-desc"><title id="hld-4-pipeline-title">Notification pipeline</title><desc id="hld-4-pipeline-desc">A business event is accepted once by the notification service, which de-duplicates by event ID and saves it. Preferences decide which channels to use. One message per channel goes to its own queue. Channel workers render the template and call the provider. A temporary failure goes back to the queue with exponential backoff; after the last attempt the message goes to a dead-letter queue. Success records SENT.</desc>
