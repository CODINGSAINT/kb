<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Grace time and paid credit are separate rules</title><desc id="fig-desc">A visit enters at 09:00, pays 40 rupees at 09:59 and has grace until 10:09. At 10:01 no extra fee is due. At 10:10 total tariff is 60, previous credit is 40 and additional due is 20 rupees.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1198" height="778" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">Grace time and paid credit are separate rules</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">First hour includes its exact endpoint. Any positive time beyond it starts an extra hour.</text><rect x="60" y="142" width="320" height="170" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="82" y="178" font-size="23" fill="#252044" text-anchor="start" font-weight="700">09:00 · enter</text><text x="82" y="216" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Tariff frozen: first hour ₹40</text><text x="82" y="247" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Each extra started hour ₹20</text><text x="82" y="278" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Money stored as integer paise</text><rect x="440" y="142" width="320" height="170" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="462" y="178" font-size="23" fill="#252044" text-anchor="start" font-weight="700">09:59 · confirmed payment</text><text x="462" y="216" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Total ₹40 · credit ₹40</text><text x="462" y="247" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">exitBy = 10:09</text><text x="462" y="278" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Spot remains occupied</text><rect x="820" y="142" width="320" height="170" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="842" y="178" font-size="23" fill="#252044" text-anchor="start" font-weight="700">10:10 · grace has expired</text><text x="842" y="216" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Tariff total = ₹60</text><text x="842" y="247" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Already paid = ₹40</text><text x="842" y="278" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">New payment due = ₹20</text><path d="M384,226 L434,226" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><path d="M764,226 L814,226" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><path d="M100,401 L1100,401" fill="none" stroke="#6550c5" stroke-width="5"/><rect x="450" y="373" width="450" height="56" rx="10" fill="#e1f3ed" stroke="#e1f3ed" stroke-width="2"/><text x="675" y="409" font-size="22" fill="#12786c" text-anchor="middle" font-weight="700">paid exit grace</text><circle cx="100" cy="401" r="7" fill="#6550c5"/><text x="100" y="459" font-size="20" fill="#625d7b" text-anchor="middle" font-weight="400">09:00</text><circle cx="450" cy="401" r="7" fill="#6550c5"/><text x="450" y="459" font-size="20" fill="#625d7b" text-anchor="middle" font-weight="400">09:59</text><circle cx="610" cy="401" r="7" fill="#6550c5"/><text x="610" y="459" font-size="20" fill="#625d7b" text-anchor="middle" font-weight="400">10:01</text><circle cx="900" cy="401" r="7" fill="#6550c5"/><text x="900" y="459" font-size="20" fill="#625d7b" text-anchor="middle" font-weight="400">10:09</text><circle cx="1100" cy="401" r="7" fill="#6550c5"/><text x="1100" y="459" font-size="20" fill="#625d7b" text-anchor="middle" font-weight="400">10:10</text><rect x="60" y="510" width="510" height="163" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="82" y="546" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Exit at 10:01 → covered</text><text x="82" y="584" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Do not charge just because hour two began.</text><text x="82" y="615" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Inside the valid grace: due = 0.</text><text x="82" y="646" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Only physical exit closes the visit.</text><rect x="620" y="510" width="520" height="163" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="642" y="546" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Pay at 10:10 → top up the difference</text><text x="642" y="584" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">due = max(0, total − paid) = ₹20</text><text x="642" y="615" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Never bill the whole ₹60 a second time.</text><text x="642" y="646" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Retrying the old key does not renew grace.</text><text x="60" y="711" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">Event spacing is illustrative; the implementation compares exact Instants and Durations.</text><path d="M44,732 L1156,732" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="760" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
