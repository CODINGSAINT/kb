dle" font-weight="400">1</text><text x="336" y="604.24" text-anchor="middle" font-family="'Segoe UI Symbol', 'DejaVu Sans', serif" font-size="43.68" fill="#252044">♔</text><text x="504" y="604.24" text-anchor="middle" font-family="'Segoe UI Symbol', 'DejaVu Sans', serif" font-size="43.68" fill="#252044">♖</text><text x="112" y="212.24" text-anchor="middle" font-family="'Segoe UI Symbol', 'DejaVu Sans', serif" font-size="43.68" fill="#252044">♚</text><text x="392" y="212.24" text-anchor="middle" font-family="'Segoe UI Symbol', 'DejaVu Sans', serif" font-size="43.68" fill="#252044">♜</text><path d="M392,196 L392,588" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><path d="M336,588 L448,588" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><rect x="628" y="164" width="490" height="186" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="650" y="200" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Checking only e1 and g1 misses this</text><text x="650" y="238" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">1 · Start e1: safe</text><text x="650" y="269" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">2 · Cross f1: attacked → reject</text><text x="650" y="300" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">3 · Destination g1: safe is insufficient</text><rect x="628" y="376" width="490" height="260" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="650" y="412" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Other castling conditions</text><text x="650" y="450" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">The right still exists; rook is present.</text><text x="650" y="481" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">The path is empty.</text><text x="650" y="512" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Test transit with the king moved.</text><text x="650" y="543" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Move king and rook in the final trial.</text><text x="650" y="574" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Then check the final king position.</text><path d="M44,712 L1156,712" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="740" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
