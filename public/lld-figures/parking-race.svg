<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Two gates, one last compatible spot</title><desc id="fig-desc">Gate A checks and records spot C17 ownership in one critical section. Gate B waits and rechecks after A commits; it cannot claim the same spot.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1198" height="808" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">Two gates, one last compatible spot</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">The same boundary owns all indexes needed to create a visit. No display or payment call runs here.</text><rect x="84" y="137" width="310" height="38" rx="19" fill="#e1f3ed" stroke="#e1f3ed" stroke-width="2"/><text x="239" y="163" font-size="19" fill="#12786c" text-anchor="middle" font-weight="700">GATE A</text><rect x="810" y="137" width="310" height="38" rx="19" fill="#fff1d9" stroke="#fff1d9" stroke-width="2"/><text x="965" y="163" font-size="19" fill="#9b5b0a" text-anchor="middle" font-weight="700">GATE B</text><path d="M239,190 L239,622" fill="none" stroke="#12786c" stroke-width="3"/><path d="M965,190 L965,622" fill="none" stroke="#9b5b0a" stroke-width="3"/><rect x="390" y="200" width="414" height="113" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="412" y="236" font-size="23" fill="#252044" text-anchor="start" font-weight="700">One short lot monitor</text><text x="412" y="274" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">A selects C17 → installs visit S17</text><path d="M239,247 L386,247" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><path d="M965,247 L810,247" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><text x="889" y="225" font-size="21" fill="#9b5b0a" text-anchor="middle" font-weight="400">wait</text><rect x="390" y="353" width="414" height="113" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="412" y="389" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Ownership is now C17 → S17</text><text x="412" y="427" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Session, active plate and entry key agree</text><path d="M596,316 L596,346" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><path d="M390,416 L239,416" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><text x="78" y="448" font-size="20" fill="#12786c" text-anchor="start" font-weight="400">A returns the same visit on retry</text><rect x="390" y="511" width="414" height="102" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="412" y="547" font-size="23" fill="#252044" text-anchor="start" font-weight="700">B enters and rechecks</text><text x="412" y="585" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">No compatible free spot → reject</text><path d="M965,557 L810,557" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><path d="M804,591 L965,591" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><rect x="84" y="653" width="1036" height="82" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="106" y="689" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Selection and claim are one transaction, not two separately locked getters.</text><path d="M44,762 L1156,762" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="790" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
