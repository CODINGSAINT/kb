<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">En passant can expose a horizontal attack</title><desc id="fig-desc">Before: a5 rook is blocked by pawns f5 and g5. Trial g5xf6 en passant removes both blockers and exposes king h5; reject.</desc>
