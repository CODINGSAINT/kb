<title id="fig-title">A parking lot is physical space plus ownership</title><desc id="fig-desc">Two gates contend for compact spot C17. A serialized claim gives it to visit S17; the second gate rechecks availability. Other bays illustrate occupied, disabled and compatible spaces.</desc>
