<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="955" viewBox="0 0 1240 955" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Reassignment changes the owner, not the call</title><desc id="fig-desc">Call forty-one retains its original age when A fails. Release increments its epoch from one to two. B receives epoch three. A late acknowledgement for epoch one is rejected. Cabin destinations remain in A.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1238" height="953" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">Reassignment changes the owner, not the call</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">An epoch is a version of ownership; late events are checked against the current version.</text><rect x="60" y="139" width="310" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="215" y="165" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">CALL LEDGER</text><rect x="460" y="139" width="310" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="615" y="165" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">CAR A</text><rect x="860" y="139" width="310" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="1015" y="165" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">CAR B</text><path d="M215,191 L215,714" fill="none" stroke="#d8d2e9" stroke-width="3" stroke-dasharray="7 8"/><path d="M615,191 L615,714" fill="none" stroke="#d8d2e9" stroke-width="3" stroke-dasharray="7 8"/><path d="M1015,191 L1015,714" fill="none" stroke="#d8d2e9" stroke-width="3" stroke-dasharray="7 8"/><rect x="50" y="208" width="330" height="104" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="72" y="244" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Call 41 · createdTick 0</text><text x="72" y="282" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">ASSIGNED to A · epoch 1</text><path d="M382,257 L615,257" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><rect x="630" y="237" width="245" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="752.5" y="263" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">owns (41, 1)</text><text x="615" y="351" font-size="24" fill="#9b5b0a" text-anchor="middle" font-weight="700">A fails</text><path d="M610,369 L382,369" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><rect x="50" y="358" width="330" height="104" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="72" y="394" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Same call · same age</text><text x="72" y="432" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">WAITING · epoch 2</text><rect x="50" y="507" width="330" height="104" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="72" y="543" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Replacement assignment</text><text x="72" y="581" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">ASSIGNED to B · epoch 3</text><path d="M382,552 L1015,552" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><rect x="886" y="576" width="260" height="38" rx="19" fill="#e1f3ed" stroke="#e1f3ed" stroke-width="2"/><text x="1016" y="602" font-size="19" fill="#12786c" text-anchor="middle" font-weight="700">owns (41, 3)</text><path d="M610,664 L382,664" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><text x="700" y="673" font-size="21" fill="#9b5b0a" text-anchor="start" font-weight="400">late A ack (41, 1)</text><text x="65" y="692" font-size="20" fill="#9b5b0a" text-anchor="start" font-weight="400">Rejected: owner / epoch mismatch</text><rect x="50" y="748" width="1120" height="100" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="72" y="784" font-size="23" fill="#252044" text-anchor="start" font-weight="700">A retains its onboard cabin destinations.</text><text x="72" y="822" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Reassigning a waiting pickup cannot transfer people already inside a failed car.</text><path d="M44,907 L1196,907" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="935" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
