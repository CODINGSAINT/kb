<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="805" viewBox="0 0 1240 805" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Nearest car does not mean earliest pickup</title><desc id="fig-desc">Car A starts at zero with cabin stops three and six. Car B starts at three heading toward cabin stop one. A hall Up request at two is served in four modeled events by A or nine by B.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1238" height="803" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">Nearest car does not mean earliest pickup</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">Known-plan replay uses the same directional sweep and door rules as execution.</text><rect x="110" y="135" width="630" height="564" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><path d="M136,667 L714,667" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="653" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">0</text><path d="M136,615 L714,615" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="601" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">1</text><path d="M136,563 L714,563" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="549" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">2</text><path d="M136,511 L714,511" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="497" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">3</text><path d="M136,459 L714,459" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="445" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">4</text><path d="M136,407 L714,407" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="393" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">5</text><path d="M136,355 L714,355" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="341" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">6</text><path d="M136,303 L714,303" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="289" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">7</text><path d="M136,251 L714,251" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="237" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">8</text><path d="M136,199 L714,199" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="150" y="185" font-size="22" fill="#625d7b" text-anchor="start" font-weight="400">9</text><rect x="232" y="153" width="140" height="518" rx="0" fill="#eeebf5" stroke="#d8d2e9" stroke-width="2"/><rect x="476" y="153" width="140" height="518" rx="0" fill="#eeebf5" stroke="#d8d2e9" stroke-width="2"/><rect x="244" y="623" width="116" height="44" rx="6" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><text x="302" y="654" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">A · 0</text><rect x="488" y="467" width="116" height="44" rx="6" fill="#9b5b0a" stroke="#9b5b0a" stroke-width="2"/><text x="546" y="498" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">B · 3</text><path d="M398,645 L398,541" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><path d="M645,489 L645,593" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><rect x="235" y="472" width="134" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="302" y="498" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">cabin 3</text><rect x="235" y="316" width="134" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="302" y="342" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">cabin 6</text><rect x="480" y="576" width="132" height="38" rx="19" fill="#fff1d9" stroke="#fff1d9" stroke-width="2"/><text x="546" y="602" font-size="19" fill="#9b5b0a" text-anchor="middle" font-weight="700">cabin 1</text><path d="M760,555 L760,518" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><text x="760" y="595" font-size="26" fill="#12786c" text-anchor="middle" font-weight="700">2 ↑</text><rect x="836" y="154" width="320" height="190" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="858" y="190" font-size="23" fill="#252044" text-anchor="start" font-weight="700">A · farther, serving Up</text><text x="858" y="228" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">0 → 1 → 2</text><text x="858" y="259" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">OPENING → OPEN</text><text x="858" y="290" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Pickup: 4 model ticks</text><rect x="836" y="375" width="320" height="250" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="858" y="411" font-size="23" fill="#252044" text-anchor="start" font-weight="700">B · closer, serving Down</text><text x="858" y="449" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">3 → 2 → 1</text><text x="858" y="480" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Open, dwell and close</text><text x="858" y="511" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">1 → 2, then open</text><text x="858" y="542" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Pickup: 9 model ticks</text><text x="110" y="739" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">A tick is one floor/door event in this model. These numbers are not seconds.</text><path d="M44,757 L1196,757" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="785" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
