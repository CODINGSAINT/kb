<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Direction is part of the stop contract</title><desc id="fig-desc">Car A starts at zero with cabin destinations three and seven, hall Up at two and hall Down at five. It opens at two Up, three Up, seven Up, then five Down.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1238" height="808" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">Direction is part of the stop contract</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">LOOK-style service reverses at remaining demand, rather than visiting the endpoint by default.</text><rect x="330" y="140" width="420" height="560" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><path d="M350,650 L730,650" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="641" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">0</text><path d="M350,598 L730,598" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="589" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">1</text><path d="M350,546 L730,546" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="537" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">2</text><path d="M350,494 L730,494" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="485" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">3</text><path d="M350,442 L730,442" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="433" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">4</text><path d="M350,390 L730,390" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="381" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">5</text><path d="M350,338 L730,338" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="329" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">6</text><path d="M350,286 L730,286" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="277" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">7</text><path d="M350,234 L730,234" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="225" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">8</text><path d="M350,182 L730,182" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="365" y="173" font-size="19" fill="#625d7b" text-anchor="start" font-weight="400">9</text><path d="M480,650 L480,286" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><path d="M620,286 L620,390" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><circle cx="480" cy="546" r="19" fill="#12786c"/><text x="480" y="553" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="106" y="553" font-size="22" fill="#12786c" text-anchor="start" font-weight="400">2 ↑ · hall</text><circle cx="480" cy="494" r="19" fill="#12786c"/><text x="480" y="501" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="106" y="501" font-size="22" fill="#12786c" text-anchor="start" font-weight="400">3 · cabin</text><circle cx="480" cy="286" r="19" fill="#12786c"/><text x="480" y="293" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="106" y="293" font-size="22" fill="#12786c" text-anchor="start" font-weight="400">7 · cabin</text><circle cx="620" cy="390" r="19" fill="#9b5b0a"/><text x="620" y="397" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="654" y="397" font-size="22" fill="#9b5b0a" text-anchor="start" font-weight="400">5 ↓ · hall</text><rect x="400" y="610" width="180" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="490" y="636" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">A starts at 0</text><rect x="814" y="154" width="350" height="222" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="836" y="190" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Upward sweep</text><text x="836" y="228" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Serve 2 ↑, then cabin 3.</text><text x="836" y="259" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Pass 5 ↓ without serving it.</text><text x="836" y="290" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Continue to cabin 7.</text><text x="836" y="321" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">No further Up demand: reverse.</text><rect x="814" y="407" width="350" height="184" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="836" y="443" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Return sweep</text><text x="836" y="481" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Open at 5, boarding Down.</text><text x="836" y="512" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">A matching pickup clears 5 ↓.</text><text x="836" y="543" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">No pending demand → idle.</text><text x="80" y="743" font-size="24" fill="#252044" text-anchor="start" font-weight="700">Observed opening order: 2:UP → 3:UP → 7:UP → 5:DOWN</text><path d="M44,762 L1196,762" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="790" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
