<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Release the lock, not the parking spot</title><desc id="fig-desc">Payment reserves an attempt under a short lock, calls the provider without that lock, and applies a terminal result once. Another entry progresses during provider I/O. Unknown charges are reconciled by the original key.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1198" height="868" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">Release the lock, not the parking spot</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">The payment adapter must preserve idempotency and distinguish uncertainty from a known decline.</text><rect x="60" y="139" width="300" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="210" y="165" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">LOT STATE OWNER</text><rect x="450" y="139" width="300" height="38" rx="19" fill="#fff1d9" stroke="#fff1d9" stroke-width="2"/><text x="600" y="165" font-size="19" fill="#9b5b0a" text-anchor="middle" font-weight="700">PAYMENT PROVIDER</text><rect x="840" y="139" width="300" height="38" rx="19" fill="#e1f3ed" stroke="#e1f3ed" stroke-width="2"/><text x="990" y="165" font-size="19" fill="#12786c" text-anchor="middle" font-weight="700">ANOTHER GATE</text><path d="M210,195 L210,565" fill="none" stroke="#d8d2e9" stroke-width="3" stroke-dasharray="8 8"/><path d="M600,195 L600,565" fill="none" stroke="#d8d2e9" stroke-width="3" stroke-dasharray="8 8"/><path d="M990,195 L990,565" fill="none" stroke="#d8d2e9" stroke-width="3" stroke-dasharray="8 8"/><rect x="190" y="210" width="40" height="80" rx="16" fill="#eeeafa" stroke="#d8d2e9" stroke-width="2"/><text x="64" y="204" font-size="20" fill="#6550c5" text-anchor="start" font-weight="400">1 · reserve attempt</text><path d="M230,258 L590,258" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><text x="410" y="240" font-size="18" fill="#6550c5" text-anchor="middle" font-weight="400">charge(stable key, approved amount)</text><rect x="580" y="258" width="40" height="220" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="632" y="320" font-size="21" fill="#9b5b0a" text-anchor="start" font-weight="400">Slow I/O</text><text x="632" y="348" font-size="19" fill="#9b5b0a" text-anchor="start" font-weight="400">no lot lock held</text><path d="M990,375 L230,375" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><text x="825" y="400" font-size="20" fill="#12786c" text-anchor="middle" font-weight="400">entry still progresses</text><rect x="190" y="358" width="40" height="62" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><path d="M230,420 L990,420" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><path d="M580,495 L230,495" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><text x="410" y="477" font-size="18" fill="#9b5b0a" text-anchor="middle" font-weight="400">confirmed / declined / unknown</text><rect x="190" y="495" width="40" height="60" rx="16" fill="#eeeafa" stroke="#d8d2e9" stroke-width="2"/><text x="64" y="590" font-size="20" fill="#6550c5" text-anchor="start" font-weight="400">3 · apply once</text><text x="62" y="653" font-size="26" fill="#252044" text-anchor="start" font-weight="700">A timeout is not a decline.</text><rect x="60" y="691" width="180" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="150" y="717" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">PARKED</text><rect x="310" y="691" width="190" height="38" rx="19" fill="#eeeafa" stroke="#eeeafa" stroke-width="2"/><text x="405" y="717" font-size="19" fill="#6550c5" text-anchor="middle" font-weight="700">PENDING</text><rect x="590" y="691" width="190" height="38" rx="19" fill="#fff1d9" stroke="#fff1d9" stroke-width="2"/><text x="685" y="717" font-size="19" fill="#9b5b0a" text-anchor="middle" font-weight="700">UNKNOWN</text><rect x="930" y="691" width="190" height="38" rx="19" fill="#e1f3ed" stroke="#e1f3ed" stroke-width="2"/><text x="1025" y="717" font-size="19" fill="#12786c" text-anchor="middle" font-weight="700">PAID</text><path d="M244,710 L306,710" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><path d="M504,710 L586,710" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><path d="M784,710 L926,710" fill="none" stroke="#12786c" stroke-width="3" marker-end="url(#teal)"/><text x="855" y="691" font-size="17" fill="#12786c" text-anchor="middle" font-weight="400">lookup key</text><text x="60" y="784" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">Unknown outcome: keep the spot occupied, block a new payment key, reconcile the original key.</text><path d="M44,822 L1156,822" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="850" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
