<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="780" viewBox="0 0 1260 780" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">A stop plan cannot override the door state</title><desc id="fig-desc">Four door states form a cycle. Closing obstruction reopens the door. Movement requires normal mode, closed doors, clear obstruction, true interlock and non-overloaded load.</desc>
<defs><marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6550c5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12786c"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b5b0a"/></marker></defs>
<g font-family="Arial, 'Segoe UI', sans-serif"><rect x="1" y="1" width="1258" height="778" rx="22" fill="#f8f7fc" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="54" font-size="30" fill="#252044" text-anchor="start" font-weight="700">A stop plan cannot override the door state</text><text x="44" y="89" font-size="20" fill="#625d7b" text-anchor="start" font-weight="400">Discrete floor-event simulator; independent certified hardware remains the real safety boundary.</text><rect x="70" y="148" width="200" height="230" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="170" y="185" font-size="24" fill="#252044" text-anchor="middle" font-weight="700">CLOSED</text><rect x="102" y="208" width="136" height="128" rx="0" fill="#e5e0f2" stroke="#d8d2e9" stroke-width="2"/><rect x="103" y="209" width="67" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="170" y="209" width="67" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="370" y="148" width="200" height="230" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="470" y="185" font-size="24" fill="#252044" text-anchor="middle" font-weight="700">OPENING</text><rect x="402" y="208" width="136" height="128" rx="0" fill="#e5e0f2" stroke="#d8d2e9" stroke-width="2"/><rect x="403" y="209" width="53" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="484" y="209" width="53" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="670" y="148" width="200" height="230" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="770" y="185" font-size="24" fill="#252044" text-anchor="middle" font-weight="700">OPEN</text><rect x="702" y="208" width="136" height="128" rx="0" fill="#e5e0f2" stroke="#d8d2e9" stroke-width="2"/><rect x="703" y="209" width="24" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="813" y="209" width="24" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="970" y="148" width="200" height="230" rx="16" fill="#ffffff" stroke="#d8d2e9" stroke-width="2"/><text x="1070" y="185" font-size="24" fill="#252044" text-anchor="middle" font-weight="700">CLOSING</text><rect x="1002" y="208" width="136" height="128" rx="0" fill="#e5e0f2" stroke="#d8d2e9" stroke-width="2"/><rect x="1003" y="209" width="53" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><rect x="1084" y="209" width="53" height="126" rx="0" fill="#6550c5" stroke="#6550c5" stroke-width="2"/><path d="M276,270 L364,270" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><path d="M576,270 L664,270" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><path d="M876,270 L964,270" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><path d="M1070,382 L1070,432 L170,432 L170,382" fill="none" stroke="#6550c5" stroke-width="3" marker-end="url(#violet)"/><text x="620" y="465" font-size="21" fill="#6550c5" text-anchor="middle" font-weight="400">close completes → CLOSED</text><path d="M1070,145 L1070,118 L470,118 L470,145" fill="none" stroke="#9b5b0a" stroke-width="3" marker-end="url(#amber)"/><text x="768" y="113" font-size="19" fill="#9b5b0a" text-anchor="middle" font-weight="400">obstructed while closing → reopen</text><rect x="60" y="510" width="550" height="198" rx="16" fill="#e1f3ed" stroke="#d8d2e9" stroke-width="2"/><text x="82" y="546" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Travel requires every guard</text><text x="82" y="584" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">NORMAL · door CLOSED</text><text x="82" y="615" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">no obstruction · interlock satisfied</text><text x="82" y="646" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">load ≤ capacity</text><text x="82" y="677" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">One false condition → no movement</text><rect x="650" y="510" width="550" height="198" rx="16" fill="#fff1d9" stroke="#d8d2e9" stroke-width="2"/><text x="672" y="546" font-size="23" fill="#252044" text-anchor="start" font-weight="700">Full differs from overloaded</text><text x="672" y="584" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">load == capacity: cabin travel allowed</text><text x="672" y="615" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">No new hall pickup while full.</text><text x="672" y="646" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">load &gt; capacity: cannot travel</text><text x="672" y="677" font-size="21" fill="#625d7b" text-anchor="start" font-weight="400">An open door stays open while blocked.</text><path d="M44,732 L1216,732" fill="none" stroke="#d8d2e9" stroke-width="2"/><text x="44" y="760" font-size="16" fill="#625d7b" text-anchor="start" font-weight="400">CODING SAINT / KB · Original worked reference · Java 21</text></g></svg>
