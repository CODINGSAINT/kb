<svg xmlns="http://www.w3.org/2000/svg" width="440" height="542" viewBox="0 0 440 542" role="img" aria-labelledby="title desc">
<title id="title">One rendition fails without corrupting publication</title><desc id="desc">Track each processing task and publish only valid outputs. Steps: 720p transcode succeeds and 1080p task crashes; Manifest builder sees 1080p incomplete; Publish valid 720p under the chosen readiness policy; Retry 1080p with a task identity; replace manifest version safely</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#514b89"/></marker></defs>
<rect width="440" height="100%" rx="18" fill="#f7f7fc"/>
<text x="24" y="32" fill="#25213e" font-family="Arial,sans-serif" font-size="19" font-weight="700">One rendition fails without corrupting</text>
<text x="24" y="55" fill="#25213e" font-family="Arial,sans-serif" font-size="19" font-weight="700">publication</text>
<rect x="18" y="88" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="128" r="15" fill="#30285e"/>
<text x="44" y="133" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">1</text>
<text x="70" y="112" fill="#25213e" font-family="Arial,sans-serif" font-size="15">720p transcode succeeds and 1080p task</text>
<text x="70" y="132" fill="#25213e" font-family="Arial,sans-serif" font-size="15">crashes</text>
<path d="M220 172 V191" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="196" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="236" r="15" fill="#30285e"/>
<text x="44" y="241" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">2</text>
<text x="70" y="220" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Manifest builder sees 1080p incomplete</text>
<path d="M220 280 V299" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="304" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="344" r="15" fill="#30285e"/>
<text x="44" y="349" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">3</text>
<text x="70" y="328" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Publish valid 720p under the chosen</text>
<text x="70" y="348" fill="#25213e" font-family="Arial,sans-serif" font-size="15">readiness policy</text>
<path d="M220 388 V407" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="412" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="452" r="15" fill="#30285e"/>
<text x="44" y="457" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">4</text>
<text x="70" y="436" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Retry 1080p with a task identity; replace</text>
<text x="70" y="456" fill="#25213e" font-family="Arial,sans-serif" font-size="15">manifest version safely</text>
</svg>
