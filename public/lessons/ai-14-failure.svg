<svg xmlns="http://www.w3.org/2000/svg" width="440" height="542" viewBox="0 0 440 542" role="img" aria-labelledby="title desc">
<title id="title">Repeated ineffective actions must terminate</title><desc id="desc">A model can keep choosing the same unhelpful step unless the application intervenes. Steps: Agent searches the same query and gets no evidence; Next proposal repeats the identical search; Application detects no progress or exhausted step allowance; Return incomplete or needs-input outcome instead of looping forever</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#514b89"/></marker></defs>
<rect width="440" height="100%" rx="18" fill="#f7f7fc"/>
<text x="24" y="32" fill="#25213e" font-family="Arial,sans-serif" font-size="19" font-weight="700">Repeated ineffective actions must</text>
<text x="24" y="55" fill="#25213e" font-family="Arial,sans-serif" font-size="19" font-weight="700">terminate</text>
<rect x="18" y="88" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="128" r="15" fill="#30285e"/>
<text x="44" y="133" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">1</text>
<text x="70" y="112" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Agent searches the same query and gets no</text>
<text x="70" y="132" fill="#25213e" font-family="Arial,sans-serif" font-size="15">evidence</text>
<path d="M220 172 V191" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="196" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="236" r="15" fill="#30285e"/>
<text x="44" y="241" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">2</text>
<text x="70" y="220" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Next proposal repeats the identical search</text>
<path d="M220 280 V299" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="304" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="344" r="15" fill="#30285e"/>
<text x="44" y="349" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">3</text>
<text x="70" y="328" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Application detects no progress or</text>
<text x="70" y="348" fill="#25213e" font-family="Arial,sans-serif" font-size="15">exhausted step allowance</text>
<path d="M220 388 V407" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="412" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="452" r="15" fill="#30285e"/>
<text x="44" y="457" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">4</text>
<text x="70" y="436" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Return incomplete or needs-input outcome</text>
<text x="70" y="456" fill="#25213e" font-family="Arial,sans-serif" font-size="15">instead of looping forever</text>
</svg>
