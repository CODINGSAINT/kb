<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-labelledby="title desc">
<title id="title">One location observation reaches the right viewer</title><desc id="desc">Latest-state ordering precedes fan-out to authorized subscribers. Steps: Driver sends trip location with session and sequence 88; Ingest validates identity, bounds and event freshness; Latest-state store conditionally accepts sequence 88; Fan-out service publishes to authorized trip subscribers; Viewer interpolates display and shows last-update age</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#514b89"/></marker></defs>
<rect width="440" height="100%" rx="18" fill="#f7f7fc"/>
<text x="24" y="32" fill="#25213e" font-family="Arial,sans-serif" font-size="19" font-weight="700">One location observation reaches the</text>
<text x="24" y="55" fill="#25213e" font-family="Arial,sans-serif" font-size="19" font-weight="700">right viewer</text>
<rect x="18" y="88" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="128" r="15" fill="#30285e"/>
<text x="44" y="133" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">1</text>
<text x="70" y="112" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Driver sends trip location with session and</text>
<text x="70" y="132" fill="#25213e" font-family="Arial,sans-serif" font-size="15">sequence 88</text>
<path d="M220 172 V191" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="196" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="236" r="15" fill="#30285e"/>
<text x="44" y="241" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">2</text>
<text x="70" y="220" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Ingest validates identity, bounds and event</text>
<text x="70" y="240" fill="#25213e" font-family="Arial,sans-serif" font-size="15">freshness</text>
<path d="M220 280 V299" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="304" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="344" r="15" fill="#30285e"/>
<text x="44" y="349" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">3</text>
<text x="70" y="328" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Latest-state store conditionally accepts</text>
<text x="70" y="348" fill="#25213e" font-family="Arial,sans-serif" font-size="15">sequence 88</text>
<path d="M220 388 V407" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="412" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="452" r="15" fill="#30285e"/>
<text x="44" y="457" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">4</text>
<text x="70" y="436" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Fan-out service publishes to authorized</text>
<text x="70" y="456" fill="#25213e" font-family="Arial,sans-serif" font-size="15">trip subscribers</text>
<path d="M220 496 V515" stroke="#514b89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="520" width="404" height="80" rx="12" fill="white" stroke="#cac7df"/>
<circle cx="44" cy="560" r="15" fill="#30285e"/>
<text x="44" y="565" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">5</text>
<text x="70" y="544" fill="#25213e" font-family="Arial,sans-serif" font-size="15">Viewer interpolates display and shows</text>
<text x="70" y="564" fill="#25213e" font-family="Arial,sans-serif" font-size="15">last-update age</text>
</svg>
