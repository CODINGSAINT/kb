<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360" role="img" aria-labelledby="title desc"><title id="title">A token bucket refills over elapsed time</title><desc id="desc">Capacity is five permits and refill is two permits per second. After five immediate requests the bucket is empty. After 1.25 seconds it holds 2.5 permits; two requests leave 0.5, and one further permit is available after another 0.25 seconds.</desc><rect width="100%" height="100%" rx="12" fill="#f7f7fc"/><g font-family="Arial,sans-serif" fill="#25213e"><text x="20" y="29" font-size="18" font-weight="bold">Capacity 5; refill 2 permits/second</text><text x="20" y="56" font-size="15">Initially: five permits</text><rect x="22" y="68" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="22" y="68" width="60" height="25" rx="5" fill="#514b89"/><rect x="95" y="68" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="95" y="68" width="60" height="25" rx="5" fill="#514b89"/><rect x="168" y="68" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="168" y="68" width="60" height="25" rx="5" fill="#514b89"/><rect x="241" y="68" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="241" y="68" width="60" height="25" rx="5" fill="#514b89"/><rect x="314" y="68" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="314" y="68" width="60" height="25" rx="5" fill="#514b89"/><text x="20" y="128" font-size="15">After five accepted requests</text><rect x="22" y="140" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="95" y="140" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="168" y="140" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="241" y="140" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="314" y="140" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><text x="20" y="200" font-size="15">After 1.25 seconds: 2.5 permits</text><rect x="22" y="212" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="22" y="212" width="60" height="25" rx="5" fill="#514b89"/><rect x="95" y="212" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="95" y="212" width="60" height="25" rx="5" fill="#514b89"/><rect x="168" y="212" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="168" y="212" width="30" height="25" rx="5" fill="#514b89"/><rect x="241" y="212" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="314" y="212" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><text x="20" y="272" font-size="15">After two requests: 0.5 permit</text><rect x="22" y="284" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="22" y="284" width="30" height="25" rx="5" fill="#514b89"/><rect x="95" y="284" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="168" y="284" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="241" y="284" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/><rect x="314" y="284" width="60" height="25" rx="5" fill="white" stroke="#b6b0d0"/></g></svg>
