<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc"><title id="title">URL shortener: separate durable mappings from analytics</title><desc id="desc">Client traffic enters URL services. Services use Redis as a cache and a partition router for durable mapping shards. Replicas copy each shard. Click events go asynchronously to analytics rather than blocking redirects.</desc><rect width="100%" height="100%" rx="12" fill="#f7f7fc"/><g font-family="Arial,sans-serif" fill="#25213e"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#514b89"/></marker></defs><text x="22" y="30" font-size="20" font-weight="bold">URL shortener: two paths, different guarantees</text><path d="M205 90 L255 90" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M435 90 L485 90" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M575 115 L575 185" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M500 115 L345 185" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M490 115 L115 185" stroke="#514b89" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M345 235 L345 305" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M370 235 L575 305" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M115 235 L115 305" stroke="#514b89" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M345 355 L345 425" stroke="#514b89" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M575 355 L575 425" stroke="#514b89" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="25" y="65" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="115" y="95" text-anchor="middle" font-size="16">Clients</text><rect x="255" y="65" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="345" y="95" text-anchor="middle" font-size="16">Routing / LB</text><rect x="485" y="65" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="575" y="95" text-anchor="middle" font-size="16">URL services</text><rect x="485" y="185" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="575" y="215" text-anchor="middle" font-size="16">Redis cache</text><rect x="255" y="185" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="345" y="215" text-anchor="middle" font-size="16">Partition router</text><rect x="25" y="185" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="115" y="215" text-anchor="middle" font-size="16">Click stream</text><rect x="255" y="305" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="345" y="335" text-anchor="middle" font-size="16">Shard 1 primary</text><rect x="485" y="305" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="575" y="335" text-anchor="middle" font-size="16">Shard 2 primary</text><rect x="25" y="305" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="115" y="335" text-anchor="middle" font-size="16">Analytics store</text><rect x="255" y="425" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="345" y="455" text-anchor="middle" font-size="16">Shard 1 replica</text><rect x="485" y="425" width="180" height="50" rx="9" fill="white" stroke="#b6b0d0"/><text x="575" y="455" text-anchor="middle" font-size="16">Shard 2 replica</text></g></svg>
