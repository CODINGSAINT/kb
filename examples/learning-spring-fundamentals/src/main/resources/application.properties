spring.application.name=learning-spring-fundamentals
server.address=127.0.0.1
server.port=8096
spring.main.banner-mode=off
# Default: use our explicit offline bean, not an auto-configured provider model.
spring.ai.model.chat=none
spring.ai.model.embedding=none
# Even the opt-in profile must not download models during application startup.
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=1
